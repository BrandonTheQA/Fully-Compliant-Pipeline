name: order-service CI/CD

on:
  push:
    paths:
      - 'api/order-service/**'
      - 'k8s/order/**'
      - '.github/workflows/order-service.yml'
    branches: [ main ]
  pull_request:
    paths:
      - 'api/order-service/**'

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Discover AKS and ACR in RG-POC
        id: discover
        run: |
          AKS_NAME=$(az aks list -g RG-POC --query "[0].name" -o tsv)
          ACR_NAME=$(az acr list -g RG-POC --query "[0].name" -o tsv)
          echo "aks_name=$AKS_NAME" >> $GITHUB_OUTPUT
          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Run unit tests
        working-directory: api/order-service
        run: mvn -B -ntp test
      - name: Build jar
        working-directory: api/order-service
        run: mvn -B -ntp -DskipTests package

  push-deploy:
    needs: [discover, build-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ACR_NAME: ${{ needs.discover.outputs.acr_name }}
      AKS_NAME: ${{ needs.discover.outputs.aks_name }}
      AZURE_RESOURCE_GROUP: RG-POC
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: ACR login
        run: az acr login -n $ACR_NAME
      - name: Build and push image
        working-directory: api/order-service
        run: |
          IMAGE=$ACR_NAME.azurecr.io/order-service:${GIT_SHA}
          docker build -t $IMAGE .
          docker push $IMAGE
      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_NAME }}
      - name: Deploy manifests
        run: |
          export ACR_NAME=${{ env.ACR_NAME }}
          export GIT_SHA=${{ env.GIT_SHA }}
          kubectl create namespace app-services --dry-run=client -o yaml | kubectl apply -f -
          envsubst < k8s/order/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/order/service.yaml
      - name: Wait for rollout
        run: kubectl rollout status deploy/order-service -n app-services --timeout=180s
