name: Deploy Java Services to AKS

on:
  push:
    branches:
      - main
    paths:
      - 'api/functionapp/**'
      - 'scripts/**'
      - 'docs/aks-deployment.md'
      - '.github/workflows/deploy-aks.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Container image tag to deploy'
        required: false
        default: ''

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
  ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
  AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
  AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
  AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
  AKS_NAMESPACE: ${{ secrets.AKS_NAMESPACE || 'retail-platform' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      - name: Build and push service images
        env:
          IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}
        run: |
          chmod +x scripts/build-images.sh
          ./scripts/build-images.sh ${{ env.ACR_LOGIN_SERVER }} ${IMAGE_TAG}

      - name: Upload image tag
        id: image
        env:
          IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}
        run: echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Deploy manifests to AKS
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.tag || github.sha }}
        run: |
          chmod +x scripts/deploy-aks.sh
          ./scripts/deploy-aks.sh ${{ env.ACR_LOGIN_SERVER }} ${IMAGE_TAG} ${{ env.AKS_NAMESPACE }}
