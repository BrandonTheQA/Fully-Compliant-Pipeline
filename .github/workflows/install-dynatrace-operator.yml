name: Install Dynatrace OneAgent on Azure App Services

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment(s) to configure"
        required: true
        default: "all"
        type: choice
        options:
          - dev
          - qa
          - prod
          - all

env:
  # Azure configuration (kept consistent with ci-cd-appservice.yml)
  AZURE_RESOURCE_GROUP: rg-ecompoc-shared-westus3
  # Dynatrace configuration (must be set as GitHub repository secrets)
  DT_ENDPOINT: ${{ secrets.DYNATRACE_ENDPOINT }}
  DT_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
  DT_INCLUDE: ${{ secrets.DYNATRACE_INCLUDE }}

permissions:
  id-token: write
  contents: read

jobs:
  configure-dynatrace:
    name: Configure Dynatrace on Azure App Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure subscription
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -n "${AZURE_SUBSCRIPTION_ID:-}" ]; then
            az account set --subscription "${AZURE_SUBSCRIPTION_ID}"
          else
            echo "AZURE_SUBSCRIPTION_ID not set; using default subscription context."
          fi

      - name: Validate Dynatrace configuration
        run: |
          set -euo pipefail
          if [ -z "${DT_ENDPOINT:-}" ] || [ -z "${DT_API_TOKEN:-}" ] || [ -z "${DT_INCLUDE:-}" ]; then
            echo "DT_ENDPOINT, DT_API_TOKEN, and DT_INCLUDE must be provided as secrets." >&2
            exit 1
          fi
          echo "Dynatrace configuration detected. Endpoint: ${DT_ENDPOINT}"

      - name: Configure Dynatrace for selected environment(s)
        env:
          TARGET_ENV_INPUT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail

          RESOURCE_GROUP="${AZURE_RESOURCE_GROUP}"
          if [ -z "${RESOURCE_GROUP}" ]; then
            echo "AZURE_RESOURCE_GROUP is not set." >&2
            exit 1
          fi

          # Derive list of environments to process
          case "${TARGET_ENV_INPUT}" in
            dev|qa|prod)
              ENVS="${TARGET_ENV_INPUT}"
              ;;
            all)
              ENVS="dev qa prod"
              ;;
            *)
              echo "Unsupported environment input: ${TARGET_ENV_INPUT}" >&2
              exit 1
              ;;
          esac

          echo "Configuring Dynatrace for environments: ${ENVS}"

          configure_app() {
            local env_name="$1"
            local app_role="$2" # backend or ui

            local app_name="app-ecompoc-${env_name}-${app_role}"
            echo "-----"
            echo "Configuring app: ${app_name} (env=${env_name}, role=${app_role})"

            if ! az webapp show --resource-group "${RESOURCE_GROUP}" --name "${app_name}" >/dev/null 2>&1; then
              echo "Error: Web App '${app_name}' not found in resource group '${RESOURCE_GROUP}'" >&2
              exit 1
            fi

            # Choose START_APP_CMD based on app role
            local start_cmd=""
            if [ "${app_role}" = "backend" ]; then
              # Java backend JAR deployed to /home/site/wwwroot
              start_cmd='java -jar /home/site/wwwroot/*.jar'
            else
              # Node.js UI using PM2 + ecosystem.config.js
              start_cmd='pm2 start ecosystem.config.js --no-daemon'
            fi

            echo "Using START_APP_CMD: ${start_cmd}"

            echo "Setting Dynatrace app settings on ${app_name}..."
            az webapp config appsettings set \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${app_name}" \
              --settings \
                DT_ENDPOINT="${DT_ENDPOINT}" \
                DT_API_TOKEN="${DT_API_TOKEN}" \
                DT_INCLUDE="${DT_INCLUDE}" \
                START_APP_CMD="${start_cmd}" \
              >/dev/null

            # Startup command recommended by Dynatrace for Azure App Service Linux
            # Reference:
            # https://docs.dynatrace.com/docs/ingest-from/microsoft-azure-services/azure-integrations/azure-appservice/integrate-oneagent-on-web-app-for-containers
            local dynatrace_startup_cmd
            dynatrace_startup_cmd='wget -O /tmp/installer-wrapper.sh -q https://raw.githubusercontent.com/dynatrace-oss/cloud-snippets/main/azure/linux-app-service/oneagent-installer.sh && DT_ENDPOINT=$DT_ENDPOINT DT_API_TOKEN=$DT_API_TOKEN DT_INCLUDE=$DT_INCLUDE START_APP_CMD=$START_APP_CMD sh /tmp/installer-wrapper.sh'

            echo "Setting startup command for ${app_name} to Dynatrace installer wrapper..."
            az webapp config set \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${app_name}" \
              --startup-file "${dynatrace_startup_cmd}" \
              >/dev/null

            echo "Current configured startup command for ${app_name}:"
            az webapp config show \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${app_name}" \
              --query "siteConfig.appCommandLine" -o tsv

            echo "Restarting ${app_name} twice (per Dynatrace recommendation)..."
            az webapp restart --resource-group "${RESOURCE_GROUP}" --name "${app_name}" >/dev/null
            az webapp restart --resource-group "${RESOURCE_GROUP}" --name "${app_name}" >/dev/null

            echo "Completed Dynatrace configuration for ${app_name}"
          }

          for env_name in ${ENVS}; do
            configure_app "${env_name}" "backend"
            configure_app "${env_name}" "ui"
          done

          echo "Dynatrace configuration finished for all selected environments."
