name: Install Dynatrace Operator on EKS

on:
  workflow_dispatch:
    inputs:
      eks_cluster_name:
        description: "EKS cluster name"
        required: true
        type: string
      aws_region:
        description: "AWS region of the EKS cluster"
        required: true
        type: string
      create_dynatrace_secret:
        description: "Create Dynatrace secret (dynakube) with API/PAAS tokens"
        required: false
        default: false
        type: boolean

jobs:
  install:
    name: Install Dynatrace Operator
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      DYNATRACE_API_URL: ${{ secrets.DYNATRACE_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Configure kubectl for EKS cluster
        run: |
          aws eks update-kubeconfig \
            --name "${{ inputs.eks_cluster_name }}" \
            --region "${{ inputs.aws_region }}"

      - name: Create dynatrace namespace if missing
        run: |
          kubectl create namespace dynatrace --dry-run=client -o yaml | kubectl apply -f -

      - name: Install/upgrade Dynatrace Operator
        run: |
          # Install from Dynatrace's OCI registry (public.ecr.aws)
          helm upgrade --install dynatrace-operator oci://public.ecr.aws/dynatrace/dynatrace-operator \
            --namespace dynatrace \
            --create-namespace

      - name: Wait for Dynatrace Operator to be ready
        run: |
          echo "Waiting for Dynatrace Operator deployment to be ready..."
          kubectl wait --for=condition=available deployment/dynatrace-operator -n dynatrace --timeout=300s || {
            echo "Error: Dynatrace Operator deployment did not become ready" >&2
            kubectl describe deployment dynatrace-operator -n dynatrace
            exit 1
          }
          echo "Dynatrace Operator is ready"

      - name: Wait for Dynatrace CRDs to be installed and established
        run: |
          echo "Waiting for CRD dynakubes.dynatrace.com to be available and established..."
          for i in {1..60}; do
            if kubectl get crd dynakubes.dynatrace.com &>/dev/null; then
              # Check if CRD is established (not just exists)
              ESTABLISHED=$(kubectl get crd dynakubes.dynatrace.com -o jsonpath='{.status.conditions[?(@.type=="Established")].status}' 2>/dev/null || echo "")
              if [ "$ESTABLISHED" = "True" ]; then
                echo "CRD dynakubes.dynatrace.com is established"
                # Give it a moment to fully register
                sleep 5
                break
              else
                echo "CRD exists but not yet established (attempt $i/60)..."
              fi
            else
              echo "CRD not found yet (attempt $i/60)..."
            fi
            sleep 5
            if [ "$i" -eq 60 ]; then
              echo "Timeout waiting for CRD dynakubes.dynatrace.com to be established" >&2
              kubectl get crd dynakubes.dynatrace.com -o yaml || echo "CRD does not exist"
              exit 1
            fi
          done

      - name: Optionally create Dynatrace tokens secret (dynakube)
        if: ${{ inputs.create_dynatrace_secret }}
        env:
          DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
          DYNATRACE_PAAS_TOKEN: ${{ secrets.DYNATRACE_PAAS_TOKEN }}
          DYNATRACE_DATA_INGEST_TOKEN: ${{ secrets.DYNATRACE_DATA_INGEST_TOKEN }}
        run: |
          if [ -z "${DYNATRACE_API_TOKEN}" ] || [ -z "${DYNATRACE_PAAS_TOKEN}" ]; then
            echo "Dynatrace tokens not provided in secrets. Skipping secret creation." >&2
            exit 1
          fi
          # Build args for data ingest token if provided
          EXTRA_ARGS=""
          if [ -n "${DYNATRACE_DATA_INGEST_TOKEN}" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} --from-literal=dataIngestToken=\"${DYNATRACE_DATA_INGEST_TOKEN}\""
          fi
          # Create/Update the dynakube secret including optional dataIngestToken
          eval kubectl -n dynatrace create secret generic dynakube \
            --from-literal=apiToken=\"${DYNATRACE_API_TOKEN}\" \
            --from-literal=paasToken=\"${DYNATRACE_PAAS_TOKEN}\" \
            ${EXTRA_ARGS} \
            --dry-run=client -o yaml | kubectl apply -f -


