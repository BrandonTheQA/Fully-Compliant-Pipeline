name: Connect EKS to Dynatrace Environment

on:
  workflow_dispatch:
    inputs:
      eks_cluster_name:
        description: "EKS cluster name"
        required: true
        type: string
      aws_region:
        description: "AWS region of the EKS cluster"
        required: true
        type: string
      dynatrace_environment_url:
        description: "Dynatrace environment URL (e.g., https://xxxxx.live.dynatrace.com)"
        required: true
        type: string
      dynakube_name:
        description: "Name for the DynaKube resource (default: dynakube)"
        required: false
        default: "dynakube"
        type: string
      create_secret_if_missing:
        description: "Create Dynatrace secret if it doesn't exist"
        required: false
        default: true
        type: boolean
      storage_class_name:
        description: "StorageClass name for ActiveGate PVC (default: auto-detect from cluster)"
        required: false
        default: ""
        type: string

jobs:
  connect:
    name: Connect EKS to Dynatrace
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      DYNATRACE_ENVIRONMENT_URL: ${{ inputs.dynatrace_environment_url }}
      DYNAKUBE_NAME: ${{ inputs.dynakube_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubectl for EKS cluster
        run: |
          aws eks update-kubeconfig \
            --name "${{ inputs.eks_cluster_name }}" \
            --region "${{ inputs.aws_region }}"

      - name: Verify Dynatrace Operator is installed
        run: |
          if ! kubectl get deployment dynatrace-operator -n dynatrace &>/dev/null; then
            echo "Error: Dynatrace Operator not found in dynatrace namespace" >&2
            echo "Please run the 'Install Dynatrace Operator on EKS' workflow first" >&2
            exit 1
          fi
          echo "Dynatrace Operator is installed"

      - name: Wait for Dynatrace Operator to be ready
        run: |
          echo "Waiting for Dynatrace Operator deployment to be ready..."
          kubectl wait --for=condition=available deployment/dynatrace-operator -n dynatrace --timeout=300s || {
            echo "Error: Dynatrace Operator deployment did not become ready" >&2
            kubectl describe deployment dynatrace-operator -n dynatrace
            exit 1
          }
          echo "Dynatrace Operator is ready"

      - name: Wait for Dynatrace CRDs to be installed and established
        run: |
          echo "Waiting for CRD dynakubes.dynatrace.com to be available and established..."
          for i in {1..60}; do
            if kubectl get crd dynakubes.dynatrace.com &>/dev/null; then
              # Check if CRD is established (not just exists)
              ESTABLISHED=$(kubectl get crd dynakubes.dynatrace.com -o jsonpath='{.status.conditions[?(@.type=="Established")].status}' 2>/dev/null || echo "")
              if [ "$ESTABLISHED" = "True" ]; then
                echo "CRD dynakubes.dynatrace.com is established"
                # Give it a moment to fully register
                sleep 5
                break
              else
                echo "CRD exists but not yet established (attempt $i/60)..."
              fi
            else
              echo "CRD not found yet (attempt $i/60)..."
            fi
            sleep 5
            if [ "$i" -eq 60 ]; then
              echo "Timeout waiting for CRD dynakubes.dynatrace.com to be established" >&2
              kubectl get crd dynakubes.dynatrace.com -o yaml || echo "CRD does not exist"
              exit 1
            fi
          done

      - name: Detect StorageClass for ActiveGate
        id: storage-class
        run: |
          if [ -n "${{ inputs.storage_class_name }}" ]; then
            STORAGE_CLASS="${{ inputs.storage_class_name }}"
            echo "Using provided StorageClass: ${STORAGE_CLASS}"
          else
            # Try to find default storage class
            STORAGE_CLASS=$(kubectl get storageclass -o jsonpath='{.items[?(@.metadata.annotations.storageclass\.kubernetes\.io/is-default-class=="true")].metadata.name}' 2>/dev/null || echo "")
            
            if [ -z "${STORAGE_CLASS}" ]; then
              # If no default, try to find gp3 or gp2 (common EKS storage classes)
              STORAGE_CLASS=$(kubectl get storageclass -o jsonpath='{.items[?(@.metadata.name=="gp3")].metadata.name}' 2>/dev/null || echo "")
            fi
            
            if [ -z "${STORAGE_CLASS}" ]; then
              STORAGE_CLASS=$(kubectl get storageclass -o jsonpath='{.items[?(@.metadata.name=="gp2")].metadata.name}' 2>/dev/null || echo "")
            fi
            
            if [ -z "${STORAGE_CLASS}" ]; then
              # Get the first available storage class
              STORAGE_CLASS=$(kubectl get storageclass -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
            fi
            
            if [ -z "${STORAGE_CLASS}" ]; then
              echo "Error: No StorageClass found in cluster. Please specify one via storage_class_name input." >&2
              kubectl get storageclass
              exit 1
            fi
            
            echo "Auto-detected StorageClass: ${STORAGE_CLASS}"
          fi
          
          echo "storage_class=${STORAGE_CLASS}" >> $GITHUB_OUTPUT
          echo "Using StorageClass: ${STORAGE_CLASS}"

      - name: Create Dynatrace secret and DynaKube from template
        env:
          DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
          DYNATRACE_DATA_INGEST_TOKEN: ${{ secrets.DYNATRACE_DATA_INGEST_TOKEN }}
        run: |
          if [ -z "${DYNATRACE_API_TOKEN}" ] || [ -z "${DYNATRACE_DATA_INGEST_TOKEN}" ]; then
            echo "Error: DYNATRACE_API_TOKEN and DYNATRACE_DATA_INGEST_TOKEN secrets are required" >&2
            exit 1
          fi

          # Base64 encode tokens (no newline)
          API_TOKEN_B64=$(echo -n "${DYNATRACE_API_TOKEN}" | base64 | tr -d '\n')
          DATA_INGEST_TOKEN_B64=$(echo -n "${DYNATRACE_DATA_INGEST_TOKEN}" | base64 | tr -d '\n')

          # Substitute template variables
          export DYNAKUBE_NAME="${{ env.DYNAKUBE_NAME }}"
          export DYNATRACE_API_URL="${{ env.DYNATRACE_ENVIRONMENT_URL }}/api"
          export STORAGE_CLASS_NAME="${{ steps.storage-class.outputs.storage_class }}"
          export API_TOKEN_B64
          export DATA_INGEST_TOKEN_B64

          # Process template and apply (idempotent - safe to run multiple times)
          envsubst < k8s/dynatrace/dynakube.yaml.template | kubectl apply -f -

      - name: Verify Dynatrace secret exists
        run: |
          if ! kubectl get secret "${{ env.DYNAKUBE_NAME }}" -n dynatrace &>/dev/null; then
            echo "Error: Secret ${{ env.DYNAKUBE_NAME }} not found in dynatrace namespace" >&2
            echo "Please ensure the secret exists or set create_secret_if_missing to true" >&2
            exit 1
          fi
          echo "Secret ${{ env.DYNAKUBE_NAME }} exists"

      - name: Wait for DynaKube to be ready
        run: |
          echo "Waiting for DynaKube ${{ env.DYNAKUBE_NAME }} to be ready..."
          kubectl wait --for=condition=Ready dynakube/${{ env.DYNAKUBE_NAME }} -n dynatrace --timeout=300s || {
            echo "Warning: DynaKube did not become ready within 5 minutes"
            echo "Current status:"
            kubectl get dynakube ${{ env.DYNAKUBE_NAME }} -n dynatrace -o yaml
            exit 1
          }
          echo "DynaKube ${{ env.DYNAKUBE_NAME }} is ready"

      - name: Wait for ActiveGate to be ready
        run: |
          echo "Waiting for ActiveGate StatefulSet to be created..."
          for i in {1..60}; do
            if kubectl get statefulset dynakube-activegate -n dynatrace &>/dev/null; then
              echo "ActiveGate StatefulSet found, waiting for pod to be ready..."
              kubectl wait --for=condition=ready pod/dynakube-activegate-0 -n dynatrace --timeout=300s || {
                echo "Warning: ActiveGate pod did not become ready within 5 minutes"
                kubectl describe pod dynakube-activegate-0 -n dynatrace || true
              }
              break
            fi
            echo "ActiveGate StatefulSet not found yet (attempt $i/60), sleeping 5s..."
            sleep 5
            if [ "$i" -eq 60 ]; then
              echo "Warning: ActiveGate StatefulSet was not created" >&2
              echo "Checking DynaKube status..."
              kubectl get dynakube ${{ env.DYNAKUBE_NAME }} -n dynatrace -o yaml
              exit 1
            fi
          done

      - name: Display connection status
        run: |
          echo "=== DynaKube Status ==="
          kubectl get dynakube ${{ env.DYNAKUBE_NAME }} -n dynatrace
          echo ""
          echo "=== DynaKube Details ==="
          kubectl describe dynakube ${{ env.DYNAKUBE_NAME }} -n dynatrace | head -50
          echo ""
          echo "=== ActiveGate Status ==="
          kubectl get statefulset dynakube-activegate -n dynatrace || echo "ActiveGate StatefulSet not found"
          kubectl get pods -n dynatrace -l app.kubernetes.io/name=activegate || echo "ActiveGate pods not found"
          echo ""
          echo "=== All Dynatrace Pods ==="
          kubectl get pods -n dynatrace

