name: Connect EKS to Dynatrace Environment

on:
  workflow_dispatch:
    inputs:
      eks_cluster_name:
        description: "EKS cluster name"
        required: true
        type: string
      aws_region:
        description: "AWS region of the EKS cluster"
        required: true
        type: string
      dynatrace_environment_url:
        description: "Dynatrace environment URL (e.g., https://xxxxx.live.dynatrace.com)"
        required: true
        type: string
      dynakube_name:
        description: "Name for the DynaKube resource (default: dynakube)"
        required: false
        default: "dynakube"
        type: string
      create_secret_if_missing:
        description: "Create Dynatrace secret if it doesn't exist"
        required: false
        default: true
        type: boolean

jobs:
  connect:
    name: Connect EKS to Dynatrace
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      DYNATRACE_ENVIRONMENT_URL: ${{ inputs.dynatrace_environment_url }}
      DYNAKUBE_NAME: ${{ inputs.dynakube_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubectl for EKS cluster
        run: |
          aws eks update-kubeconfig \
            --name "${{ inputs.eks_cluster_name }}" \
            --region "${{ inputs.aws_region }}"

      - name: Verify Dynatrace Operator is installed
        run: |
          if ! kubectl get deployment dynatrace-operator -n dynatrace &>/dev/null; then
            echo "Error: Dynatrace Operator not found in dynatrace namespace" >&2
            echo "Please run the 'Install Dynatrace Operator on EKS' workflow first" >&2
            exit 1
          fi
          echo "Dynatrace Operator is installed"

      - name: Wait for Dynatrace Operator to be ready
        run: |
          echo "Waiting for Dynatrace Operator deployment to be ready..."
          kubectl wait --for=condition=available deployment/dynatrace-operator -n dynatrace --timeout=300s || {
            echo "Error: Dynatrace Operator deployment did not become ready" >&2
            kubectl describe deployment dynatrace-operator -n dynatrace
            exit 1
          }
          echo "Dynatrace Operator is ready"

      - name: Wait for Dynatrace CRDs to be installed and established
        run: |
          echo "Waiting for CRD dynakubes.dynatrace.com to be available and established..."
          for i in {1..60}; do
            if kubectl get crd dynakubes.dynatrace.com &>/dev/null; then
              # Check if CRD is established (not just exists)
              ESTABLISHED=$(kubectl get crd dynakubes.dynatrace.com -o jsonpath='{.status.conditions[?(@.type=="Established")].status}' 2>/dev/null || echo "")
              if [ "$ESTABLISHED" = "True" ]; then
                echo "CRD dynakubes.dynatrace.com is established"
                # Give it a moment to fully register
                sleep 5
                break
              else
                echo "CRD exists but not yet established (attempt $i/60)..."
              fi
            else
              echo "CRD not found yet (attempt $i/60)..."
            fi
            sleep 5
            if [ "$i" -eq 60 ]; then
              echo "Timeout waiting for CRD dynakubes.dynatrace.com to be established" >&2
              kubectl get crd dynakubes.dynatrace.com -o yaml || echo "CRD does not exist"
              exit 1
            fi
          done

      - name: Create Dynatrace secret if missing
        if: ${{ inputs.create_secret_if_missing }}
        env:
          DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
          DYNATRACE_PAAS_TOKEN: ${{ secrets.DYNATRACE_PAAS_TOKEN }}
          DYNATRACE_DATA_INGEST_TOKEN: ${{ secrets.DYNATRACE_DATA_INGEST_TOKEN }}
        run: |
          if [ -z "${DYNATRACE_API_TOKEN}" ] || [ -z "${DYNATRACE_PAAS_TOKEN}" ]; then
            echo "Error: DYNATRACE_API_TOKEN and DYNATRACE_PAAS_TOKEN secrets are required" >&2
            exit 1
          fi

          EXTRA_ARGS=""
          if [ -n "${DYNATRACE_DATA_INGEST_TOKEN}" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} --from-literal=dataIngestToken=\"${DYNATRACE_DATA_INGEST_TOKEN}\""
          fi

          echo "Applying secret ${{ env.DYNAKUBE_NAME }} (idempotent)"
          eval kubectl -n dynatrace create secret generic "${{ env.DYNAKUBE_NAME }}" \
            --from-literal=apiToken=\"${DYNATRACE_API_TOKEN}\" \
            --from-literal=paasToken=\"${DYNATRACE_PAAS_TOKEN}\" \
            ${EXTRA_ARGS} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Verify Dynatrace secret exists
        run: |
          if ! kubectl get secret "${{ env.DYNAKUBE_NAME }}" -n dynatrace &>/dev/null; then
            echo "Error: Secret ${{ env.DYNAKUBE_NAME }} not found in dynatrace namespace" >&2
            echo "Please ensure the secret exists or set create_secret_if_missing to true" >&2
            exit 1
          fi
          echo "Secret ${{ env.DYNAKUBE_NAME }} exists"

      - name: Create DynaKube Custom Resource
        run: |
          # Determine served CRD version for DynaKube (e.g., v1beta3)
          CRD_VERSION=$(kubectl get crd dynakubes.dynatrace.com -o jsonpath='{.spec.versions[?(@.served==true)].name}' | awk '{print $1}')
          if [ -z "$CRD_VERSION" ]; then
            echo "Error: Unable to determine served CRD version for dynakubes.dynatrace.com" >&2
            kubectl get crd dynakubes.dynatrace.com -o yaml || true
            exit 1
          fi

          cat <<EOF | kubectl apply -f -
          apiVersion: dynatrace.com/${CRD_VERSION}
          kind: DynaKube
          metadata:
            name: ${{ env.DYNAKUBE_NAME }}
            namespace: dynatrace
          spec:
            apiUrl: ${{ env.DYNATRACE_ENVIRONMENT_URL }}/api
            tokens: ${{ env.DYNAKUBE_NAME }}
            oneAgent:
              cloudNativeFullStack: {}
          EOF

      - name: Wait for DynaKube to be ready
        run: |
          echo "Waiting for DynaKube ${{ env.DYNAKUBE_NAME }} to be ready..."
          kubectl wait --for=condition=Ready dynakube/${{ env.DYNAKUBE_NAME }} -n dynatrace --timeout=300s || {
            echo "Warning: DynaKube did not become ready within 5 minutes"
            echo "Current status:"
            kubectl get dynakube ${{ env.DYNAKUBE_NAME }} -n dynatrace -o yaml
            exit 1
          }
          echo "DynaKube ${{ env.DYNAKUBE_NAME }} is ready"

      - name: Display connection status
        run: |
          echo "=== DynaKube Status ==="
          kubectl get dynakube ${{ env.DYNAKUBE_NAME }} -n dynatrace
          echo ""
          echo "=== DynaKube Details ==="
          kubectl describe dynakube ${{ env.DYNAKUBE_NAME }} -n dynatrace | head -50

