name: CI-CD Azure App Service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AZURE_RESOURCE_GROUP: rg-ecompoc-shared-westus3
  AZURE_REGION: westus3
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

permissions:
  id-token: write
  contents: read

jobs:
  build-backend:
    name: Build ecomPOC Service Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Build service
        working-directory: api/services/ecompoc
        run: mvn -B package -DskipTests

      - name: Package service artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts/backend
          JAR_PATH=$(find api/services/ecompoc/target -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          if [[ -z "${JAR_PATH}" ]]; then
            echo "No JAR produced by build" >&2
            exit 1
          fi
          cp "${JAR_PATH}" artifacts/backend/ecompoc-service.jar
          (cd artifacts/backend && zip -q ../ecompoc-backend.zip ecompoc-service.jar)

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecompoc-backend
          path: artifacts/ecompoc-backend.zip
          retention-days: 3

  build-ui:
    name: Build UI Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Package UI artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts/ui
          cp -R ui/dist/. artifacts/ui/
          (cd artifacts/ui && zip -qr ../ecompoc-ui.zip .)

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecompoc-ui
          path: artifacts/ecompoc-ui.zip
          retention-days: 3

  ensure-appservice-plans:
    name: Ensure App Service Plans
    runs-on: ubuntu-latest
    needs: [build-backend, build-ui]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure subscription
        run: |
          if [ -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          fi

      - name: Provision App Service plans
        run: ./scripts/provision-ecompoc-appservice.sh

  deploy-appservice:
    name: Deploy to Azure App Service (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [ensure-appservice-plans]
    environment: ${{ matrix.environment }}
    strategy:
      matrix:
        include:
          - environment: dev
            backend_plan: asp-ecompoc-dev-backend-westus3
            backend_app: app-ecompoc-dev-backend
            ui_plan: asp-ecompoc-dev-ui-westus3
            ui_app: app-ecompoc-dev-ui
          - environment: qa
            backend_plan: asp-ecompoc-qa-backend-westus3
            backend_app: app-ecompoc-qa-backend
            ui_plan: asp-ecompoc-qa-ui-westus3
            ui_app: app-ecompoc-qa-ui
          - environment: prod
            backend_plan: asp-ecompoc-prod-backend-westus3
            backend_app: app-ecompoc-prod-backend
            ui_plan: asp-ecompoc-prod-ui-westus3
            ui_app: app-ecompoc-prod-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure subscription
        run: |
          if [ -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          fi

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: ecompoc-backend
          path: artifacts/backend

      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ecompoc-ui
          path: artifacts/ui

      - name: Deploy backend
        run: |
          set -euo pipefail
          # Create backend web app if it doesn't exist
          if ! az webapp show --name "${{ matrix.backend_app }}" --resource-group "${AZURE_RESOURCE_GROUP}" >/dev/null 2>&1; then
            echo "Creating backend web app: ${{ matrix.backend_app }}"
            az webapp create \
              --name "${{ matrix.backend_app }}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --plan "${{ matrix.backend_plan }}" \
              --runtime "JAVA:17-java17" \
              --https-only true
          fi
          # Configure web app
          az webapp config set \
            --name "${{ matrix.backend_app }}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --linux-fx-version "JAVA:17-java17"
          # Deploy the application
          az webapp deploy \
            --name "${{ matrix.backend_app }}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --type zip \
            --src-path artifacts/backend/ecompoc-backend.zip \
            --clean true
          # Set startup command
          az webapp config set \
            --name "${{ matrix.backend_app }}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --startup-file "java -jar /home/site/wwwroot/ecompoc-service.jar"
          # Restart the web app
          az webapp restart \
            --name "${{ matrix.backend_app }}" \
            --resource-group "${AZURE_RESOURCE_GROUP}"

      - name: Ensure UI web app exists
        run: |
          set -euo pipefail
          if ! az webapp show --name "${{ matrix.ui_app }}" --resource-group "${AZURE_RESOURCE_GROUP}" >/dev/null 2>&1; then
            az webapp create \
              --name "${{ matrix.ui_app }}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --plan "${{ matrix.ui_plan }}" \
              --runtime "NODE:20-lts" \
              --https-only true
          fi
          az webapp config set \
            --name "${{ matrix.ui_app }}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --linux-fx-version "NODE:20-lts"
          az webapp config appsettings set \
            --name "${{ matrix.ui_app }}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --settings WEBSITES_PORT=8080

      - name: Deploy UI
        run: |
          set -euo pipefail
          az webapp deploy \
            --name "${{ matrix.ui_app }}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --type zip \
            --src-path artifacts/ui/ecompoc-ui.zip \
            --clean true
          az webapp config set \
            --name "${{ matrix.ui_app }}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --startup-file "pm2 serve /home/site/wwwroot --no-daemon --spa"
          az webapp restart \
            --name "${{ matrix.ui_app }}" \
            --resource-group "${AZURE_RESOURCE_GROUP}"

      - name: Output endpoints
        run: |
          backend_host=$(az webapp show --name "${{ matrix.backend_app }}" --resource-group "${AZURE_RESOURCE_GROUP}" --query defaultHostName -o tsv)
          ui_host=$(az webapp show --name "${{ matrix.ui_app }}" --resource-group "${AZURE_RESOURCE_GROUP}" --query defaultHostName -o tsv)
          echo "Backend URL: https://${backend_host}"
          echo "UI URL: https://${ui_host}"

