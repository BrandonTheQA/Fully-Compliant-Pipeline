name: CI-CD Azure App Service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AZURE_RESOURCE_GROUP: rg-ecompoc-shared-westus3
  AZURE_REGION: westus3
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

permissions:
  id-token: write
  contents: read

jobs:
  release-report:
    name: Publish Release Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure full git history
        run: git fetch --prune --unshallow || true

      - name: Generate release report
        env:
          RELEASE_REPORT_DIR: release-report
          RELEASE_REPORT_ENVIRONMENT: prod
          RELEASE_REPORT_PATH: release-report/release-report-${{ github.run_id }}.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scripts/generate-release-report.sh

      - name: Upload release report artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-report
          path: release-report/release-report-${{ github.run_id }}.md
          retention-days: 7

      - name: Dry-run preview (pull request)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "Dry-run preview of release report:"
          cat release-report/release-report-${{ github.run_id }}.md

  validate-jira-stories:
    name: Validate JIRA Story Status
    runs-on: ubuntu-latest
    needs: [release-report]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release report artifact
        uses: actions/download-artifact@v4
        with:
          name: release-report
          path: release-report

      - name: Validate JIRA stories
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN || '' }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL || '' }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL || 'https://ecompoc.atlassian.net' }}
          JIRA_VALIDATION_ENABLED: ${{ secrets.JIRA_VALIDATION_ENABLED || 'true' }}
          RELEASE_REPORT_DIR: release-report
        run: |
          chmod +x scripts/validate-jira-stories.sh
          scripts/validate-jira-stories.sh

  build-backend:
    name: Build ecomPOC Service Artifact
    runs-on: ubuntu-latest
    needs: [release-report]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Build service with Maven
        working-directory: api/services/ecompoc
        run: mvn -B package -DskipTests

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecompoc-backend
          path: api/services/ecompoc/target/*.jar
          retention-days: 3

  build-ui:
    name: Build UI Artifact
    runs-on: ubuntu-latest
    needs: [release-report]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate npm dependencies are pinned
        run: |
          chmod +x scripts/validate-dependencies.sh
          ./scripts/validate-dependencies.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Run tests (including accessibility)
        working-directory: ui
        run: npm test

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecompoc-ui
          path: ui
          retention-days: 3

  test-coverage:
    name: Generate Test Coverage Reports
    runs-on: ubuntu-latest
    needs: [release-report]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Generate backend test coverage
        working-directory: api/services/ecompoc
        run: mvn -B clean test jacoco:report

      - name: Generate UI test coverage
        working-directory: ui
        run: npm run test:coverage

      - name: Create coverage summary
        run: |
          mkdir -p coverage-summary
          
          # Extract backend coverage from JaCoCo XML
          if [ -f api/services/ecompoc/target/site/jacoco/jacoco.xml ]; then
            BACKEND_LINES=$(grep -oP 'type="INSTRUCTION".*missed="\K[0-9]+' api/services/ecompoc/target/site/jacoco/jacoco.xml | head -1 || echo "0")
            BACKEND_COVERED=$(grep -oP 'type="INSTRUCTION".*covered="\K[0-9]+' api/services/ecompoc/target/site/jacoco/jacoco.xml | head -1 || echo "0")
            if [ -n "$BACKEND_LINES" ] && [ -n "$BACKEND_COVERED" ] && ([ "$BACKEND_LINES" != "0" ] || [ "$BACKEND_COVERED" != "0" ]); then
              BACKEND_TOTAL=$((BACKEND_LINES + BACKEND_COVERED))
              BACKEND_PCT=$((BACKEND_COVERED * 100 / BACKEND_TOTAL))
              echo "Backend Coverage: ${BACKEND_PCT}% (${BACKEND_COVERED}/${BACKEND_TOTAL} instructions)" > coverage-summary/backend-coverage.txt
            else
              echo "Backend Coverage: Unable to calculate" > coverage-summary/backend-coverage.txt
            fi
          fi
          
          # Extract UI coverage from Jest summary
          if [ -f ui/coverage/coverage-summary.json ]; then
            UI_LINES=$(jq -r '.total.lines.pct' ui/coverage/coverage-summary.json 2>/dev/null || echo "0")
            UI_STATEMENTS=$(jq -r '.total.statements.pct' ui/coverage/coverage-summary.json 2>/dev/null || echo "0")
            UI_BRANCHES=$(jq -r '.total.branches.pct' ui/coverage/coverage-summary.json 2>/dev/null || echo "0")
            UI_FUNCTIONS=$(jq -r '.total.functions.pct' ui/coverage/coverage-summary.json 2>/dev/null || echo "0")
            echo "UI Coverage:" > coverage-summary/ui-coverage.txt
            echo "  Lines: ${UI_LINES}%" >> coverage-summary/ui-coverage.txt
            echo "  Statements: ${UI_STATEMENTS}%" >> coverage-summary/ui-coverage.txt
            echo "  Branches: ${UI_BRANCHES}%" >> coverage-summary/ui-coverage.txt
            echo "  Functions: ${UI_FUNCTIONS}%" >> coverage-summary/ui-coverage.txt
          fi
          
          # Create combined markdown report
          {
            echo "# Test Coverage Report"
            echo ""
            echo "Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo "Workflow Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            echo "## Backend Coverage (Java/Maven)"
            echo ""
            if [ -f coverage-summary/backend-coverage.txt ]; then
              cat coverage-summary/backend-coverage.txt
            else
              echo "Backend coverage report not available"
            fi
            echo ""
            echo "## Frontend Coverage (Jest)"
            echo ""
            if [ -f coverage-summary/ui-coverage.txt ]; then
              cat coverage-summary/ui-coverage.txt
            else
              echo "UI coverage report not available"
            fi
            echo ""
            echo "---"
            echo ""
            echo "## Coverage Artifacts"
            echo ""
            echo "Detailed coverage reports are available as workflow artifacts:"
            echo "- Backend: JaCoCo HTML report in \`backend-coverage\` artifact"
            echo "- Frontend: Jest HTML report in \`ui-coverage\` artifact"
          } > coverage-summary/COVERAGE_REPORT.md

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            api/services/ecompoc/target/site/jacoco/**
            coverage-summary/backend-coverage.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Upload UI coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage
          path: |
            ui/coverage/**
            coverage-summary/ui-coverage.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary/COVERAGE_REPORT.md
          retention-days: 90

      - name: Display coverage summary
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage-summary/COVERAGE_REPORT.md ]; then
            cat coverage-summary/COVERAGE_REPORT.md >> $GITHUB_STEP_SUMMARY
          fi

  deploy-dev:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    needs: [build-backend, build-ui]
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure subscription
        run: |
          if [ -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          fi

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: ecompoc-backend
          path: artifacts/backend

      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ecompoc-ui
          path: artifacts/ui

      - name: Ensure backend web app exists
        run: |
          BACKEND_APP="app-ecompoc-dev-backend"
          UI_PLAN="asp-ecompoc-dev-ui-westus3"
          if ! az webapp show --name "${BACKEND_APP}" --resource-group "${AZURE_RESOURCE_GROUP}" >/dev/null 2>&1; then
            echo "Creating backend web app: ${BACKEND_APP}"
            az webapp create \
              --name "${BACKEND_APP}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --plan "${UI_PLAN}" \
              --runtime "JAVA:17-java17" \
              --https-only true
          fi

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-ecompoc-dev-backend
          package: artifacts/backend/*.jar

      - name: Ensure UI web app exists
        run: |
          UI_APP="app-ecompoc-dev-ui"
          UI_PLAN="asp-ecompoc-dev-ui-westus3"
          BACKEND_APP="app-ecompoc-dev-backend"
          BACKEND_URL="https://${BACKEND_APP}.azurewebsites.net"
          if ! az webapp show --name "${UI_APP}" --resource-group "${AZURE_RESOURCE_GROUP}" >/dev/null 2>&1; then
            az webapp create \
              --name "${UI_APP}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --plan "${UI_PLAN}" \
              --runtime "NODE:20-lts" \
              --https-only true
          fi
          az webapp config appsettings set \
            --name "${UI_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --settings BACKEND_URL="${BACKEND_URL}"

      - name: Deploy UI to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-ecompoc-dev-ui
          package: artifacts/ui

      - name: Output endpoints
        id: endpoints
        run: |
          set -euo pipefail
          BACKEND_APP="app-ecompoc-dev-backend"
          UI_APP="app-ecompoc-dev-ui"
          backend_host=$(az webapp show --name "${BACKEND_APP}" --resource-group "${AZURE_RESOURCE_GROUP}" --query defaultHostName -o tsv)
          ui_host=$(az webapp show --name "${UI_APP}" --resource-group "${AZURE_RESOURCE_GROUP}" --query defaultHostName -o tsv)
          echo "backend_url=https://${backend_host}" >> $GITHUB_OUTPUT
          echo "ui_url=https://${ui_host}" >> $GITHUB_OUTPUT
          echo "Backend URL: https://${backend_host}"
          echo "UI URL: https://${ui_host}"

      - name: Wait for services to be ready
        run: |
          set -euo pipefail
          BACKEND_APP="app-ecompoc-dev-backend"
          UI_APP="app-ecompoc-dev-ui"
          backend_url="${{ steps.endpoints.outputs.backend_url }}"
          ui_url="${{ steps.endpoints.outputs.ui_url }}"
          
          echo "Waiting for backend service to be ready..."
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -f -s "${backend_url}/actuator/health" >/dev/null 2>&1 || curl -f -s "${backend_url}/health" >/dev/null 2>&1; then
              echo "Backend service is ready"
              break
            fi
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts: Backend not ready yet, waiting 10 seconds..."
            sleep 10
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "Warning: Backend service may not be fully ready, but proceeding..."
          fi
          
          echo "Waiting for UI service to be ready..."
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -f -s "${ui_url}" >/dev/null 2>&1; then
              echo "UI service is ready"
              break
            fi
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts: UI not ready yet, waiting 10 seconds..."
            sleep 10
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "Warning: UI service may not be fully ready, but proceeding..."
          fi

  test-postman-dev:
    name: Run Postman Tests Against Dev
    runs-on: ubuntu-latest
    needs: [deploy-dev]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman tests
        run: |
          set -euo pipefail
          RAND=$(date +%s)
          BACKEND_URL="https://app-ecompoc-dev-backend.azurewebsites.net/api"
          echo "Running Postman tests against: ${BACKEND_URL}"
          newman run postman/IntegrationTest.postman_collection.json \
            --env-var apiBaseUrl="${BACKEND_URL}" \
            --env-var userName="John Doe" \
            --env-var userEmail="john.doe+${RAND}@example.com" \
            --env-var userPassword="SecurePassword123" \
            --env-var product1Name="Laptop" \
            --env-var product1Description="High-performance laptop" \
            --env-var product1Price=999.99 \
            --env-var product1Quantity=10 \
            --env-var product1Category="Electronics" \
            --env-var product1OrderQuantity=1 \
            --env-var product2Name="Mouse" \
            --env-var product2Description="Wireless mouse" \
            --env-var product2Price=29.99 \
            --env-var product2Quantity=50 \
            --env-var product2Category="Electronics" \
            --env-var product2OrderQuantity=2 \
            --env-var product3Name="Keyboard" \
            --env-var product3Description="Mechanical keyboard" \
            --env-var product3Price=79.99 \
            --env-var product3Quantity=25 \
            --env-var product3Category="Electronics" \
            --env-var product3OrderQuantity=1 \
            --color on

  test-dev:
    name: Run Selenium Tests Against Dev
    runs-on: ubuntu-latest
    needs: [test-postman-dev]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure subscription
        run: |
          if [ -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          fi

      - name: Get dev UI URL
        id: get-ui-url
        run: |
          set -euo pipefail
          UI_APP="app-ecompoc-dev-ui"
          ui_host=$(az webapp show --name "${UI_APP}" --resource-group "${AZURE_RESOURCE_GROUP}" --query defaultHostName -o tsv)
          ui_url="https://${ui_host}"
          echo "ui_url=${ui_url}" >> $GITHUB_OUTPUT
          echo "Dev UI URL: ${ui_url}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Run Selenium tests
        working-directory: selenium
        env:
          BASE_URL: ${{ steps.get-ui-url.outputs.ui_url }}
        run: |
          set -euo pipefail
          echo "Running Selenium E2E tests against: ${BASE_URL}"
          mvn clean test

  deploy-qa:
    name: Deploy to QA Environment
    runs-on: ubuntu-latest
    needs: [test-dev]
    environment: qa
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure subscription
        run: |
          if [ -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          fi

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: ecompoc-backend
          path: artifacts/backend

      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ecompoc-ui
          path: artifacts/ui

      - name: Ensure backend web app exists
        run: |
          BACKEND_APP="app-ecompoc-qa-backend"
          UI_PLAN="asp-ecompoc-qa-ui-westus3"
          if ! az webapp show --name "${BACKEND_APP}" --resource-group "${AZURE_RESOURCE_GROUP}" >/dev/null 2>&1; then
            echo "Creating backend web app: ${BACKEND_APP}"
            az webapp create \
              --name "${BACKEND_APP}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --plan "${UI_PLAN}" \
              --runtime "JAVA:17-java17" \
              --https-only true
          fi

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-ecompoc-qa-backend
          package: artifacts/backend/*.jar

      - name: Ensure UI web app exists
        run: |
          UI_APP="app-ecompoc-qa-ui"
          UI_PLAN="asp-ecompoc-qa-ui-westus3"
          BACKEND_APP="app-ecompoc-qa-backend"
          BACKEND_URL="https://${BACKEND_APP}.azurewebsites.net"
          if ! az webapp show --name "${UI_APP}" --resource-group "${AZURE_RESOURCE_GROUP}" >/dev/null 2>&1; then
            az webapp create \
              --name "${UI_APP}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --plan "${UI_PLAN}" \
              --runtime "NODE:20-lts" \
              --https-only true
          fi
          az webapp config appsettings set \
            --name "${UI_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --settings BACKEND_URL="${BACKEND_URL}"

      - name: Deploy UI to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-ecompoc-qa-ui
          package: artifacts/ui

      - name: Output endpoints
        run: |
          backend_host=$(az webapp show --name "app-ecompoc-qa-backend" --resource-group "${AZURE_RESOURCE_GROUP}" --query defaultHostName -o tsv)
          ui_host=$(az webapp show --name "app-ecompoc-qa-ui" --resource-group "${AZURE_RESOURCE_GROUP}" --query defaultHostName -o tsv)
          echo "Backend URL: https://${backend_host}"
          echo "UI URL: https://${ui_host}"

  deploy-prod:
    name: Deploy to Prod Environment
    runs-on: ubuntu-latest
    needs: [deploy-qa, validate-jira-stories]
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure subscription
        run: |
          if [ -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          fi

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: ecompoc-backend
          path: artifacts/backend

      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ecompoc-ui
          path: artifacts/ui

      - name: Ensure backend web app exists
        run: |
          BACKEND_APP="app-ecompoc-prod-backend"
          UI_PLAN="asp-ecompoc-prod-ui-westus3"
          if ! az webapp show --name "${BACKEND_APP}" --resource-group "${AZURE_RESOURCE_GROUP}" >/dev/null 2>&1; then
            echo "Creating backend web app: ${BACKEND_APP}"
            az webapp create \
              --name "${BACKEND_APP}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --plan "${UI_PLAN}" \
              --runtime "JAVA:17-java17" \
              --https-only true
          fi

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-ecompoc-prod-backend
          package: artifacts/backend/*.jar

      - name: Ensure UI web app exists
        run: |
          UI_APP="app-ecompoc-prod-ui"
          UI_PLAN="asp-ecompoc-prod-ui-westus3"
          BACKEND_APP="app-ecompoc-prod-backend"
          BACKEND_URL="https://${BACKEND_APP}.azurewebsites.net"
          if ! az webapp show --name "${UI_APP}" --resource-group "${AZURE_RESOURCE_GROUP}" >/dev/null 2>&1; then
            az webapp create \
              --name "${UI_APP}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --plan "${UI_PLAN}" \
              --runtime "NODE:20-lts" \
              --https-only true
          fi
          az webapp config appsettings set \
            --name "${UI_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --settings BACKEND_URL="${BACKEND_URL}"

      - name: Deploy UI to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-ecompoc-prod-ui
          package: artifacts/ui

      - name: Output endpoints
        run: |
          backend_host=$(az webapp show --name "app-ecompoc-prod-backend" --resource-group "${AZURE_RESOURCE_GROUP}" --query defaultHostName -o tsv)
          ui_host=$(az webapp show --name "app-ecompoc-prod-ui" --resource-group "${AZURE_RESOURCE_GROUP}" --query defaultHostName -o tsv)
          echo "Backend URL: https://${backend_host}"
          echo "UI URL: https://${ui_host}"


