name: CI-CD Azure App Service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AZURE_RESOURCE_GROUP: rg-ecompoc-shared-westus3
  AZURE_REGION: westus3
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

permissions:
  id-token: write
  contents: read

jobs:
  build-backend:
    name: Build ecomPOC Service Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Build service
        working-directory: api/services/ecompoc
        run: mvn -B package -DskipTests

      - name: Package service artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts/backend
          JAR_PATH=$(find api/services/ecompoc/target -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          if [[ -z "${JAR_PATH}" ]]; then
            echo "No JAR produced by build" >&2
            exit 1
          fi
          cp "${JAR_PATH}" artifacts/backend/ecompoc-service.jar
          (cd artifacts/backend && zip -q ../ecompoc-backend.zip ecompoc-service.jar)

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecompoc-backend
          path: artifacts/ecompoc-backend.zip
          retention-days: 3

  build-ui:
    name: Build UI Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Package UI artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts/ui
          cp -R ui/dist/. artifacts/ui/
          (cd artifacts/ui && zip -qr ../ecompoc-ui.zip .)

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecompoc-ui
          path: artifacts/ecompoc-ui.zip
          retention-days: 3

  ensure-appservice-plans:
    name: Ensure App Service Plans
    runs-on: ubuntu-latest
    needs: [build-backend, build-ui]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure subscription
        run: |
          if [ -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          fi

      - name: Provision App Service plans
        run: ./scripts/provision-ecompoc-appservice.sh

  deploy-dev:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    needs: [ensure-appservice-plans]
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure subscription
        run: |
          if [ -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          fi

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: ecompoc-backend
          path: artifacts/backend

      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ecompoc-ui
          path: artifacts/ui

      - name: Deploy backend
        run: |
          set -euo pipefail
          BACKEND_APP="app-ecompoc-dev-backend"
          BACKEND_PLAN="asp-ecompoc-dev-backend-westus3"
          # Create backend web app if it doesn't exist
          if ! az webapp show --name "${BACKEND_APP}" --resource-group "${AZURE_RESOURCE_GROUP}" >/dev/null 2>&1; then
            echo "Creating backend web app: ${BACKEND_APP}"
            az webapp create \
              --name "${BACKEND_APP}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --plan "${BACKEND_PLAN}" \
              --runtime "JAVA:17-java17" \
              --https-only true
            # Wait for app service to be fully provisioned
            echo "Waiting for app service to be ready..."
            sleep 30
          fi
          
          # Ensure app service is running
          echo "Ensuring app service is started..."
          az webapp start \
            --name "${BACKEND_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" || true
          
          # Configure web app
          echo "Configuring web app runtime..."
          az webapp config set \
            --name "${BACKEND_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --linux-fx-version "JAVA:17-java17"
          
          # Set startup command before deployment
          echo "Setting startup command..."
          az webapp config set \
            --name "${BACKEND_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --startup-file "java -jar /home/site/wwwroot/ecompoc-service.jar"
          
          # Wait a bit for configuration to propagate
          sleep 10
          
          # Verify zip file exists and is valid
          if [[ ! -f "artifacts/backend/ecompoc-backend.zip" ]]; then
            echo "Error: Deployment artifact not found at artifacts/backend/ecompoc-backend.zip" >&2
            exit 1
          fi
          
          # Deploy with retry logic
          echo "Deploying application..."
          max_retries=3
          retry_count=0
          while [ $retry_count -lt $max_retries ]; do
            if az webapp deploy \
              --name "${BACKEND_APP}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --type zip \
              --src-path artifacts/backend/ecompoc-backend.zip \
              --clean true; then
              echo "Deployment successful"
              break
            else
              retry_count=$((retry_count + 1))
              if [ $retry_count -lt $max_retries ]; then
                echo "Deployment failed, retrying in 30 seconds (attempt $retry_count/$max_retries)..."
                sleep 30
                # Restart app service before retry
                az webapp restart \
                  --name "${BACKEND_APP}" \
                  --resource-group "${AZURE_RESOURCE_GROUP}" || true
                sleep 10
              else
                echo "Deployment failed after $max_retries attempts" >&2
                exit 1
              fi
            fi
          done
          
          # Restart the web app to ensure clean state
          echo "Restarting web app..."
          az webapp restart \
            --name "${BACKEND_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}"

      - name: Ensure UI web app exists
        run: |
          set -euo pipefail
          UI_APP="app-ecompoc-dev-ui"
          UI_PLAN="asp-ecompoc-dev-ui-westus3"
          if ! az webapp show --name "${UI_APP}" --resource-group "${AZURE_RESOURCE_GROUP}" >/dev/null 2>&1; then
            az webapp create \
              --name "${UI_APP}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --plan "${UI_PLAN}" \
              --runtime "NODE:20-lts" \
              --https-only true
          fi
          az webapp config set \
            --name "${UI_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --linux-fx-version "NODE:20-lts"
          az webapp config appsettings set \
            --name "${UI_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --settings WEBSITES_PORT=8080

      - name: Deploy UI
        run: |
          set -euo pipefail
          UI_APP="app-ecompoc-dev-ui"
          az webapp deploy \
            --name "${UI_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --type zip \
            --src-path artifacts/ui/ecompoc-ui.zip \
            --clean true
          az webapp config set \
            --name "${UI_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --startup-file "pm2 serve /home/site/wwwroot --no-daemon --spa"
          az webapp restart \
            --name "${UI_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}"

      - name: Output endpoints
        id: endpoints
        run: |
          set -euo pipefail
          BACKEND_APP="app-ecompoc-dev-backend"
          UI_APP="app-ecompoc-dev-ui"
          backend_host=$(az webapp show --name "${BACKEND_APP}" --resource-group "${AZURE_RESOURCE_GROUP}" --query defaultHostName -o tsv)
          ui_host=$(az webapp show --name "${UI_APP}" --resource-group "${AZURE_RESOURCE_GROUP}" --query defaultHostName -o tsv)
          echo "backend_url=https://${backend_host}" >> $GITHUB_OUTPUT
          echo "ui_url=https://${ui_host}" >> $GITHUB_OUTPUT
          echo "Backend URL: https://${backend_host}"
          echo "UI URL: https://${ui_host}"

      - name: Wait for services to be ready
        run: |
          set -euo pipefail
          BACKEND_APP="app-ecompoc-dev-backend"
          UI_APP="app-ecompoc-dev-ui"
          backend_url="${{ steps.endpoints.outputs.backend_url }}"
          ui_url="${{ steps.endpoints.outputs.ui_url }}"
          
          echo "Waiting for backend service to be ready..."
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -f -s "${backend_url}/actuator/health" >/dev/null 2>&1 || curl -f -s "${backend_url}/health" >/dev/null 2>&1; then
              echo "Backend service is ready"
              break
            fi
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts: Backend not ready yet, waiting 10 seconds..."
            sleep 10
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "Warning: Backend service may not be fully ready, but proceeding..."
          fi
          
          echo "Waiting for UI service to be ready..."
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -f -s "${ui_url}" >/dev/null 2>&1; then
              echo "UI service is ready"
              break
            fi
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts: UI not ready yet, waiting 10 seconds..."
            sleep 10
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "Warning: UI service may not be fully ready, but proceeding..."
          fi

  test-dev:
    name: Run Selenium Tests Against Dev
    runs-on: ubuntu-latest
    needs: [deploy-dev]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure subscription
        run: |
          if [ -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          fi

      - name: Get dev UI URL
        id: get-ui-url
        run: |
          set -euo pipefail
          UI_APP="app-ecompoc-dev-ui"
          ui_host=$(az webapp show --name "${UI_APP}" --resource-group "${AZURE_RESOURCE_GROUP}" --query defaultHostName -o tsv)
          ui_url="https://${ui_host}"
          echo "ui_url=${ui_url}" >> $GITHUB_OUTPUT
          echo "Dev UI URL: ${ui_url}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Run Selenium tests
        working-directory: selenium
        env:
          BASE_URL: ${{ steps.get-ui-url.outputs.ui_url }}
        run: |
          set -euo pipefail
          echo "Running Selenium E2E tests against: ${BASE_URL}"
          mvn clean test

