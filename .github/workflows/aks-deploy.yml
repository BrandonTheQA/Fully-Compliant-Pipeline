name: Build, Push, and Deploy to AKS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
  AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
  AKS_NAMESPACE: ${{ vars.AKS_NAMESPACE }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ "order-service", "product-service", "user-service" ]
    defaults:
      run:
        working-directory: api/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test
        run: mvn -B -ntp test

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: api/${{ matrix.service }}
          file: api/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:latest
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Ensure namespace exists
        run: |
          kubectl get ns "$AKS_NAMESPACE" || kubectl create ns "$AKS_NAMESPACE"

      - name: Apply services (ClusterIP)
        run: |
          kubectl apply -n "$AKS_NAMESPACE" -f k8s/order/service.yaml
          kubectl apply -n "$AKS_NAMESPACE" -f k8s/product/service.yaml
          kubectl apply -n "$AKS_NAMESPACE" -f k8s/user/service.yaml

      - name: Template and apply deployments with current SHA
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          export ACR_NAME="$ACR_NAME"
          export GIT_SHA="$GIT_SHA"
          envsubst < k8s/order/deployment.yaml | kubectl apply -n "$AKS_NAMESPACE" -f -
          envsubst < k8s/product/deployment.yaml | kubectl apply -n "$AKS_NAMESPACE" -f -
          envsubst < k8s/user/deployment.yaml | kubectl apply -n "$AKS_NAMESPACE" -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status -n "$AKS_NAMESPACE" deployment/order-service --timeout=120s
          kubectl rollout status -n "$AKS_NAMESPACE" deployment/product-service --timeout=120s
          kubectl rollout status -n "$AKS_NAMESPACE" deployment/user-service --timeout=120s

