name: Azure Function Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Azure Function
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Java 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Build Azure Function
        working-directory: ./api/functionapp/helloworld
        run: |
          mvn clean compile package
      - name: Set Dist Version
        run: |
          BUILD_NUMBER="${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"
          echo "${BUILD_NUMBER}"
          echo "DIST_VERSION=${BUILD_NUMBER}" >> $GITHUB_ENV

  security_scans:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Java 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Run security scan
        working-directory: ./api/functionapp/helloworld
        run: |
          if [ -n "${{ secrets.NVD_API_KEY }}" ]; then
            mvn org.owasp:dependency-check-maven:check \
              -Ddependency-check.nvd.apiKey=${{ secrets.NVD_API_KEY }}
          else
            echo "NVD_API_KEY not set, running without API key (may be slower)"
            mvn org.owasp:dependency-check-maven:check
          fi

  verify_toggles:
    name: Verify Toggles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Verify feature toggles
        run: |
          echo "Verifying feature toggles configuration..."
          # Add feature toggle verification logic here

  create_release_notes:
    name: Create Release Notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Generate release notes
        run: |
          echo "Generating release notes for Azure Function deployment..."
          # Add release notes generation logic here

  deploy_dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: 
      - build
      - verify_toggles
      - security_scans
    environment: Dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Java 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Azure CLI script
        uses: azure/CLI@v1
        with:
          azcliversion: latest
          inlineScript: |
            az account show
      - name: Deploy to dev Environment
        working-directory: ./api/functionapp/helloworld
        run: |
          mvn -DappName=joaz-func-helloworld-9021 \
          -DresourceGroup=brandon \
          -Dregion=eastus2 \
          clean package azure-functions:deploy

  smoke_test_dev:
    name: Smoke Test for Dev
    needs: deploy_dev
    runs-on: ubuntu-latest
    steps:
      - name: Run Smoke Tests for Dev Environment
        run: |
          echo "Running smoke tests for Azure Function in Dev environment..."
          # Add Azure Function smoke test commands here
          # Example: curl -f https://joaz-func-helloworld-9021.azurewebsites.net/api/hello?name=test

  deploy_test:
    name: Deploy to Test
    needs: smoke_test_dev
    runs-on: ubuntu-latest
    environment: Test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Java 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy to Test Environment
        working-directory: ./api/functionapp/helloworld
        run: |
          mvn -DappName=joaz-func-helloworld-test-9021 \
          -DresourceGroup=brandon-test \
          -Dregion=eastus2 \
          clean package azure-functions:deploy

  smoke_test_test:
    name: Smoke Test for Test
    needs: deploy_test
    runs-on: ubuntu-latest
