  deploy_dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: 
      - build
      - build2
      - verify_toggles
      # - security_scans  # Commented out for faster pipeline
    environment: 
      name: Dev
      url: https://joaz-func-helloworld-9021-dev.azurewebsites.net
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Java 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Azure CLI script
        uses: azure/CLI@v1
        with:
          azcliversion: latest
          inlineScript: |
            az account show
      - name: Deploy to dev Environment
        working-directory: ./api/functionapp/helloworld
        run: |
          mvn -DfunctionAppName=joaz-func-helloworld-9021-dev \
          -DappName=joaz-func-helloworld-9021-dev \
          -DresourceGroup=brandon \
          -Dregion=westus3 \
          clean package azure-functions:deploy
      - name: Wait 5 minutes for Azure throttling
        run: |
          echo "Waiting 5 minutes between deployments to avoid Azure throttling..."
          sleep 300
      - name: Deploy helloworld2 to dev Environment
        working-directory: ./api/functionapp/helloworld2
        run: |
          mvn -DfunctionAppName=joaz-func-helloworld-9021-dev \
          -DappName=joaz-func-helloworld2-9021-dev \
          -DresourceGroup=brandon \
          -Dregion=westus3 \
          clean package azure-functions:deploy

