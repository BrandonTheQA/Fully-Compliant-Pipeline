      - name: Install Newman
        run: npm install -g newman
      - name: Run Newman Tests for Dev Environment
        run: |
          echo "Running Newman smoke tests for Azure Function in Dev environment..."
          newman run postman/HelloWorldFunction.postman_collection.json \
            --reporters cli \
            --env-var "baseUrl=https://joaz-func-helloworld-9021-dev.azurewebsites.net/api/hello"
      - name: Run Newman Tests for HelloWorld2 Dev Environment
