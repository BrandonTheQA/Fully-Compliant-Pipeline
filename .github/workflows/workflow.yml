name: Azure Function Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  discover-apps:
    name: Discover Function Apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Discover function apps
        id: set-matrix
        run: |
          apps=$(find api/functionapp -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | jq -R -s -c 'split("\n")[:-1]')
          matrix=$(echo $apps | jq -c '{include: [.[] | {
            app: .,
            "working-dir": ("./api/functionapp/" + .),
            "function-app-name-dev": ("joaz-func-" + . + "-9021-dev"),
            "function-app-name-test": ("joaz-func-" + . + "-9021-test"),
            "function-app-name-stage": ("joaz-func-" + . + "-9021-stage"),
            "function-app-name-prod": ("joaz-func-" + . + "-9021-prod"),
            "app-service-plan-dev": "asp-joaz-func-helloworld-9021-dev",
            "app-service-plan-test": "asp-joaz-func-helloworld-9021-test",
            "app-service-plan-stage": "asp-joaz-func-helloworld-9021-stage",
            "app-service-plan-prod": "asp-joaz-func-helloworld-9021-prod",
            collection: ("postman/" + (. | 
              if . == "helloworld" then "HelloWorld"
              elif . == "helloworld2" then "HelloWorld2" 
              else (. | ascii_upcase[:1] + .[1:])
              end) + "Function.postman_collection.json")
          }]}')
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  build:
    name: Build Azure Function (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: discover-apps
    strategy:
      matrix: ${{ fromJson(needs.discover-apps.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Java 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Build and Test Azure Function
        working-directory: ${{ matrix.working-dir }}
        run: |
          mvn clean compile test package
      - name: Set Dist Version
        run: |
          BUILD_NUMBER="${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"
          echo "${BUILD_NUMBER}"
          echo "DIST_VERSION=${BUILD_NUMBER}" >> $GITHUB_ENV

