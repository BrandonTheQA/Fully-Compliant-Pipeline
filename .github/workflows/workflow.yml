          echo "Health check failed after $max_attempts attempts"
          exit 1

  integration_tests:
    name: Integration Tests
    needs: 
      - discover-apps
      - smoke_test_test
    runs-on: ubuntu-latest
    environment: Test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Java 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Run Integration Tests
        run: |
          echo "Running integration tests for all function apps..."
          
          # Run integration tests for each function app
          for app in helloworld helloworld2 user; do
            echo "Running integration tests for $app..."
            cd "api/functionapp/$app"
            
            # Run Maven integration tests
            mvn test -Dtest="*IntegrationTest"
            
            if [ $? -ne 0 ]; then
              echo "Integration tests failed for $app"
              exit 1
            fi
            
            cd - > /dev/null
          done
          
          echo "All integration tests completed successfully"

