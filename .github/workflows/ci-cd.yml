name: CI-CD AKS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ACR_NAME: rgpocacr9021
  ACR_LOGIN_SERVER: rgpocacr9021.azurecr.io
  AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
  JAVA_VERSION: '17'

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: |
          az acr login -n "${ACR_NAME}"

      - name: Build and push order image
        run: |
          docker build -t ${ACR_LOGIN_SERVER}/order:${{ github.sha }} -t ${ACR_LOGIN_SERVER}/order:latest ./api/functionapp/order
          docker push ${ACR_LOGIN_SERVER}/order:${{ github.sha }}
          docker push ${ACR_LOGIN_SERVER}/order:latest

      - name: Build and push product image
        run: |
          docker build -t ${ACR_LOGIN_SERVER}/product:${{ github.sha }} -t ${ACR_LOGIN_SERVER}/product:latest ./api/functionapp/product
          docker push ${ACR_LOGIN_SERVER}/product:${{ github.sha }}
          docker push ${ACR_LOGIN_SERVER}/product:latest

      - name: Build and push user image
        run: |
          docker build -t ${ACR_LOGIN_SERVER}/user:${{ github.sha }} -t ${ACR_LOGIN_SERVER}/user:latest ./api/functionapp/user
          docker push ${ACR_LOGIN_SERVER}/user:${{ github.sha }}
          docker push ${ACR_LOGIN_SERVER}/user:latest

      - name: Build and push ui image
        run: |
          docker build -t ${ACR_LOGIN_SERVER}/ui:${{ github.sha }} -t ${ACR_LOGIN_SERVER}/ui:latest ./ui
          docker push ${ACR_LOGIN_SERVER}/ui:${{ github.sha }}
          docker push ${ACR_LOGIN_SERVER}/ui:latest

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-push
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover AKS and set context
        run: |
          AKS_NAME=$(az aks list -g "${AKS_RESOURCE_GROUP}" --query "[0].name" -o tsv)
          echo "Using AKS cluster: ${AKS_NAME}"
          az aks get-credentials -g "${AKS_RESOURCE_GROUP}" -n "${AKS_NAME}" --overwrite-existing
          kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy manifests
        run: |
          kubectl apply -f k8s/order -n dev
          kubectl apply -f k8s/product -n dev
          kubectl apply -f k8s/user -n dev
          kubectl apply -f k8s/ui -n dev

      - name: Update images to current SHA
        run: |
          kubectl set image deployment/order order=${{ env.ACR_LOGIN_SERVER }}/order:${{ github.sha }} -n dev
          kubectl set image deployment/product product=${{ env.ACR_LOGIN_SERVER }}/product:${{ github.sha }} -n dev
          kubectl set image deployment/user user=${{ env.ACR_LOGIN_SERVER }}/user:${{ github.sha }} -n dev
          kubectl set image deployment/ui ui=${{ env.ACR_LOGIN_SERVER }}/ui:${{ github.sha }} -n dev

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/order -n dev --timeout=180s || exit 1
          kubectl rollout status deployment/product -n dev --timeout=180s || exit 1
          kubectl rollout status deployment/user -n dev --timeout=180s || exit 1
          kubectl rollout status deployment/ui -n dev --timeout=180s || exit 1

      - name: Health check services
        run: |
          set -euo pipefail
          # Wait for all LoadBalancer services to get external IPs
          echo "Waiting for LoadBalancer EXTERNAL-IPs..."
          services=(order product user ui)
          declare -A service_hosts
          
          for svc in "${services[@]}"; do
            echo "Waiting for LoadBalancer EXTERNAL-IP for ${svc}..."
            host=""
            for i in {1..60}; do
              ip=$(kubectl get svc ${svc} -n dev -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
              if [ -z "${ip}" ]; then
                hostname=$(kubectl get svc ${svc} -n dev -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
              else
                hostname=""
              fi
              host=${ip:-$hostname}
              if [ -n "${host}" ]; then
                echo "${svc} endpoint: ${host}"
                service_hosts[${svc}]=${host}
                break
              fi
              sleep 5
            done
            if [ -z "${host}" ]; then
              echo "Timed out waiting for EXTERNAL-IP/hostname for ${svc}" >&2
              exit 1
            fi
          done
          
          # Perform health checks using LoadBalancer external IPs
          echo "Checking API services health via LoadBalancer..."
          api_services=(order product user)
          for svc in "${api_services[@]}"; do
            host=${service_hosts[${svc}]}
            echo "Checking health for ${svc} at http://${host}/actuator/health..."
            for i in {1..30}; do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://${host}/actuator/health || echo "000")
              if [ "${code}" = "200" ]; then
                echo "${svc} is healthy (HTTP 200)"
                break
              fi
              sleep 5
              if [ $i -eq 30 ]; then
                echo "${svc} health check failed. Last code: ${code}" >&2
                exit 1
              fi
            done
          done
          
          # Check UI service via LoadBalancer
          ui_host=${service_hosts[ui]}
          echo "Checking health for ui at http://${ui_host}/health..."
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://${ui_host}/health || echo "000")
            if [ "${code}" = "200" ]; then
              echo "ui is healthy (HTTP 200)"
              break
            fi
            sleep 5
            if [ $i -eq 30 ]; then
              echo "ui health check failed. Last code: ${code}" >&2
              exit 1
            fi
          done

