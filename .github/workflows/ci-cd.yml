name: CI-CD AKS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ACR_NAME: rgpocacr9021
  ACR_LOGIN_SERVER: rgpocacr9021.azurecr.io
  AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
  JAVA_VERSION: '17'

permissions:
  id-token: write
  contents: read

jobs:
  discover-apps:
    name: Discover Function Apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Discover function apps
        id: set-matrix
        run: |
          apps=$(find api/services -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | jq -R -s -c 'split("\n")[:-1]')
          matrix=$(echo $apps | jq -c '{include: [.[] | {
            app: .,
            "working-dir": ("./api/services/" + .)
          }]}')
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  build-push:
    name: Build and Push Docker Image (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: discover-apps
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix: ${{ fromJson(needs.discover-apps.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: |
          az acr login -n "${ACR_NAME}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.working-dir }}
          file: ${{ matrix.working-dir }}/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app }}:latest
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app }}:buildcache,mode=max

  build-push-ui:
    name: Build and Push UI Docker Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: |
          az acr login -n "${ACR_NAME}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/ui:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/ui:latest
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/ui:buildcache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/ui:buildcache,mode=max

  detect-deployment-color-dev:
    name: Detect Deployment Color for Dev
    runs-on: ubuntu-latest
    needs: [discover-apps, build-push, build-push-ui]
    outputs:
      active-color: ${{ steps.detect-color.outputs.active-color }}
      target-color: ${{ steps.detect-color.outputs.target-color }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover AKS and set context
        run: |
          AKS_NAME=$(az aks list -g "${AKS_RESOURCE_GROUP}" --query "[0].name" -o tsv)
          echo "Using AKS cluster: ${AKS_NAME}"
          az aks get-credentials -g "${AKS_RESOURCE_GROUP}" -n "${AKS_NAME}" --overwrite-existing

      - name: Ensure ConfigMap exists
        run: |
          kubectl get configmap deployment-state -n dev 2>/dev/null || kubectl apply -f k8s/deployment-state-configmap.yaml

      - name: Detect deployment color
        id: detect-color
        run: |
          ACTIVE_COLOR=$(kubectl get configmap deployment-state -n dev -o jsonpath='{.data.active-color}' 2>/dev/null || echo "blue")
          if [ "$ACTIVE_COLOR" = "blue" ]; then
            TARGET_COLOR="green"
          else
            TARGET_COLOR="blue"
          fi
          echo "active-color=$ACTIVE_COLOR" >> $GITHUB_OUTPUT
          echo "target-color=$TARGET_COLOR" >> $GITHUB_OUTPUT
          echo "Active color: $ACTIVE_COLOR, Target color: $TARGET_COLOR"

  deploy-dev:
    name: Deploy to Dev (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [discover-apps, build-push, detect-deployment-color-dev]
    environment: dev
    strategy:
      matrix: ${{ fromJson(needs.discover-apps.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover AKS and set context
        run: |
          AKS_NAME=$(az aks list -g "${AKS_RESOURCE_GROUP}" --query "[0].name" -o tsv)
          echo "Using AKS cluster: ${AKS_NAME}"
          az aks get-credentials -g "${AKS_RESOURCE_GROUP}" -n "${AKS_NAME}" --overwrite-existing
          kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or update Kubernetes secret for SQL database
        run: |
          kubectl create secret generic sql-db-secret \
            --from-literal=password="${{ secrets.SQL_SERVER_PASSWORD }}" \
            --namespace=dev \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy manifest
        run: |
          TARGET_COLOR="${{ needs.detect-deployment-color-dev.outputs.target-color }}"
          tmpdir=$(mktemp -d)
          pushd "$tmpdir"
          cp ${GITHUB_WORKSPACE}/k8s/${{ matrix.app }}/deployment.yaml .
          cp ${GITHUB_WORKSPACE}/k8s/${{ matrix.app }}/service.yaml .
          # Add deployment-color to deployment selector and pod labels using yq
          yq eval ".spec.selector.matchLabels.deployment-color = \"${TARGET_COLOR}\"" -i deployment.yaml
          yq eval ".spec.template.metadata.labels.deployment-color = \"${TARGET_COLOR}\"" -i deployment.yaml
          # Add deployment-color to service selector using yq
          yq eval ".spec.selector.deployment-color = \"${TARGET_COLOR}\"" -i service.yaml
          # Apply kustomization with nameSuffix
          cat > kustomization.yaml << EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          nameSuffix: -${TARGET_COLOR}
          namespace: dev
          resources:
            - deployment.yaml
            - service.yaml
          EOF
          kubectl apply -k .
          popd

      - name: Update image to current SHA
        run: |
          TARGET_COLOR="${{ needs.detect-deployment-color-dev.outputs.target-color }}"
          kubectl set image deployment/${{ matrix.app }}-${TARGET_COLOR} ${{ matrix.app }}=${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app }}:${{ github.sha }} -n dev

      - name: Annotate deployment and service
        run: |
          TARGET_COLOR="${{ needs.detect-deployment-color-dev.outputs.target-color }}"
          kubectl annotate deployment/${{ matrix.app }}-${TARGET_COLOR} app.kubernetes.io/instance=${{ matrix.app }}-${TARGET_COLOR} -n dev --overwrite
          kubectl annotate service/${{ matrix.app }}-${TARGET_COLOR} app.kubernetes.io/instance=${{ matrix.app }}-${TARGET_COLOR} -n dev --overwrite

      - name: Wait for rollout
        run: |
          TARGET_COLOR="${{ needs.detect-deployment-color-dev.outputs.target-color }}"
          kubectl rollout status deployment/${{ matrix.app }}-${TARGET_COLOR} -n dev --timeout=180s || exit 1

  deploy-dev-ui:
    name: Deploy UI to Dev
    runs-on: ubuntu-latest
    needs: [build-push-ui, detect-deployment-color-dev]
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover AKS and set context
        run: |
          AKS_NAME=$(az aks list -g "${AKS_RESOURCE_GROUP}" --query "[0].name" -o tsv)
          echo "Using AKS cluster: ${AKS_NAME}"
          az aks get-credentials -g "${AKS_RESOURCE_GROUP}" -n "${AKS_NAME}" --overwrite-existing
          kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy manifest
        run: |
          TARGET_COLOR="${{ needs.detect-deployment-color-dev.outputs.target-color }}"
          tmpdir=$(mktemp -d)
          pushd "$tmpdir"
          cp ${GITHUB_WORKSPACE}/k8s/ui/deployment.yaml .
          cp ${GITHUB_WORKSPACE}/k8s/ui/service.yaml .
          # Add deployment-color to deployment selector and pod labels using yq
          yq eval ".spec.selector.matchLabels.deployment-color = \"${TARGET_COLOR}\"" -i deployment.yaml
          yq eval ".spec.template.metadata.labels.deployment-color = \"${TARGET_COLOR}\"" -i deployment.yaml
          # Add deployment-color to service selector using yq
          yq eval ".spec.selector.deployment-color = \"${TARGET_COLOR}\"" -i service.yaml
          # Apply kustomization with nameSuffix
          cat > kustomization.yaml << EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          nameSuffix: -${TARGET_COLOR}
          namespace: dev
          resources:
            - deployment.yaml
            - service.yaml
          EOF
          kubectl apply -k .
          popd

      - name: Update image to current SHA
        run: |
          TARGET_COLOR="${{ needs.detect-deployment-color-dev.outputs.target-color }}"
          kubectl set image deployment/ui-${TARGET_COLOR} ui=${{ env.ACR_LOGIN_SERVER }}/ui:${{ github.sha }} -n dev

      - name: Set environment variables for UI
        run: |
          TARGET_COLOR="${{ needs.detect-deployment-color-dev.outputs.target-color }}"
          kubectl set env deployment/ui-${TARGET_COLOR} DEPLOYMENT_COLOR=${TARGET_COLOR} NAMESPACE=dev -n dev

      - name: Annotate UI deployment and service
        run: |
          TARGET_COLOR="${{ needs.detect-deployment-color-dev.outputs.target-color }}"
          kubectl annotate deployment/ui-${TARGET_COLOR} app.kubernetes.io/instance=ui-${TARGET_COLOR} -n dev --overwrite
          kubectl annotate service/ui-${TARGET_COLOR} app.kubernetes.io/instance=ui-${TARGET_COLOR} -n dev --overwrite

      - name: Wait for rollout
        run: |
          TARGET_COLOR="${{ needs.detect-deployment-color-dev.outputs.target-color }}"
          kubectl rollout status deployment/ui-${TARGET_COLOR} -n dev --timeout=180s || exit 1

  health-check-dev:
    name: Health Check Services in Dev
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-dev-ui, detect-deployment-color-dev]
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover AKS and set context
        run: |
          AKS_NAME=$(az aks list -g "${AKS_RESOURCE_GROUP}" --query "[0].name" -o tsv)
          echo "Using AKS cluster: ${AKS_NAME}"
          az aks get-credentials -g "${AKS_RESOURCE_GROUP}" -n "${AKS_NAME}" --overwrite-existing

      - name: Health check services on both blue and green
        run: |
          set -e
          ACTIVE_COLOR="${{ needs.detect-deployment-color-dev.outputs.active-color }}"
          TARGET_COLOR="${{ needs.detect-deployment-color-dev.outputs.target-color }}"
          
          # Check if active color services exist
          ACTIVE_EXISTS=false
          if kubectl get deployment ecompoc-${ACTIVE_COLOR} -n dev &>/dev/null; then
            ACTIVE_EXISTS=true
            echo "Active color (${ACTIVE_COLOR}) deployments found, will health check them"
          else
            echo "Active color (${ACTIVE_COLOR}) deployments not found, skipping health checks for active side"
          fi
          
          # Wait for LoadBalancer services to get external IPs
          echo "Waiting for LoadBalancer EXTERNAL-IPs for target color (${TARGET_COLOR})..."
          target_services=(ecompoc-${TARGET_COLOR} ui-${TARGET_COLOR})
          declare -A service_hosts
          
          # Always check target color
          for svc in "${target_services[@]}"; do
            echo "Waiting for LoadBalancer EXTERNAL-IP for ${svc}..."
            host=""
            for i in {1..60}; do
              ip=$(kubectl get svc ${svc} -n dev -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
              if [ -z "${ip}" ]; then
                hostname=$(kubectl get svc ${svc} -n dev -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
              else
                hostname=""
              fi
              host=${ip:-$hostname}
              if [ -n "${host}" ]; then
                echo "${svc} endpoint: ${host}"
                service_hosts[${svc}]=${host}
                break
              fi
              sleep 5
            done
            if [ -z "${host}" ]; then
              echo "Timed out waiting for EXTERNAL-IP/hostname for ${svc}" >&2
              exit 1
            fi
          done
          
          # Optionally check active color if it exists
          if [ "$ACTIVE_EXISTS" = "true" ]; then
            echo "Waiting for LoadBalancer EXTERNAL-IPs for active color (${ACTIVE_COLOR})..."
            active_services=(ecompoc-${ACTIVE_COLOR} ui-${ACTIVE_COLOR})
            for svc in "${active_services[@]}"; do
              echo "Waiting for LoadBalancer EXTERNAL-IP for ${svc}..."
              host=""
              for i in {1..60}; do
                ip=$(kubectl get svc ${svc} -n dev -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
                if [ -z "${ip}" ]; then
                  hostname=$(kubectl get svc ${svc} -n dev -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
                else
                  hostname=""
                fi
                host=${ip:-$hostname}
                if [ -n "${host}" ]; then
                  echo "${svc} endpoint: ${host}"
                  service_hosts[${svc}]=${host}
                  break
                fi
                sleep 5
              done
              if [ -z "${host}" ]; then
                echo "Warning: Timed out waiting for EXTERNAL-IP/hostname for ${svc}, but continuing as active side is optional" >&2
              fi
            done
          fi
          
          # Perform health checks using LoadBalancer external IPs
          echo "Checking API services health via LoadBalancer for target color (${TARGET_COLOR})..."
          target_api_services=(ecompoc-${TARGET_COLOR})
          for svc in "${target_api_services[@]}"; do
            host=${service_hosts[${svc}]}
            echo "Checking health for ${svc} at http://${host}/actuator/health..."
            for i in {1..30}; do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://${host}/actuator/health || echo "000")
              if [ "${code}" = "200" ]; then
                echo "${svc} is healthy (HTTP 200)"
                break
              fi
              sleep 5
              if [ $i -eq 30 ]; then
                echo "${svc} health check failed. Last code: ${code}" >&2
                exit 1
              fi
            done
          done
          
          # Optionally check active color API services if they exist
          if [ "$ACTIVE_EXISTS" = "true" ]; then
            echo "Checking API services health via LoadBalancer for active color (${ACTIVE_COLOR})..."
            active_api_services=(ecompoc-${ACTIVE_COLOR})
            for svc in "${active_api_services[@]}"; do
              host=${service_hosts[${svc}]:-}
              if [ -n "${host}" ]; then
                echo "Checking health for ${svc} at http://${host}/actuator/health..."
                for i in {1..30}; do
                  code=$(curl -s -o /dev/null -w "%{http_code}" http://${host}/actuator/health || echo "000")
                  if [ "${code}" = "200" ]; then
                    echo "${svc} is healthy (HTTP 200)"
                    break
                  fi
                  sleep 5
                  if [ $i -eq 30 ]; then
                    echo "Warning: ${svc} health check failed. Last code: ${code}, but continuing as active side is optional" >&2
                  fi
                done
              else
                echo "Skipping health check for ${svc} (service not available)"
              fi
            done
          fi
          
          # Check UI service for target color (required)
          ui_host=${service_hosts[ui-${TARGET_COLOR}]}
          echo "Checking health for ui-${TARGET_COLOR} at http://${ui_host}/health..."
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://${ui_host}/health || echo "000")
            if [ "${code}" = "200" ]; then
              echo "ui-${TARGET_COLOR} is healthy (HTTP 200)"
              break
            fi
            sleep 5
            if [ $i -eq 30 ]; then
              echo "ui-${TARGET_COLOR} health check failed. Last code: ${code}" >&2
              exit 1
            fi
          done
          
          # Optionally check active color UI if it exists
          if [ "$ACTIVE_EXISTS" = "true" ]; then
            ui_host=${service_hosts[ui-${ACTIVE_COLOR}]:-}
            if [ -n "${ui_host}" ]; then
              echo "Checking health for ui-${ACTIVE_COLOR} at http://${ui_host}/health..."
              for i in {1..30}; do
                code=$(curl -s -o /dev/null -w "%{http_code}" http://${ui_host}/health || echo "000")
                if [ "${code}" = "200" ]; then
                  echo "ui-${ACTIVE_COLOR} is healthy (HTTP 200)"
                  break
                fi
                sleep 5
                if [ $i -eq 30 ]; then
                  echo "Warning: ui-${ACTIVE_COLOR} health check failed. Last code: ${code}, but continuing as active side is optional" >&2
                fi
              done
            else
              echo "Skipping health check for ui-${ACTIVE_COLOR} (service not available)"
            fi
          fi

