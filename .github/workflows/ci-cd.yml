  health-check-test:
    name: Health Check Services in Test
    runs-on: ubuntu-latest
    needs: [deploy-test, deploy-test-ui, detect-deployment-color-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover AKS and set context
        run: |
          AKS_NAME=$(az aks list -g "${AKS_RESOURCE_GROUP}" --query "[0].name" -o tsv)
          echo "Using AKS cluster: ${AKS_NAME}"
          az aks get-credentials -g "${AKS_RESOURCE_GROUP}" -n "${AKS_NAME}" --overwrite-existing

      - name: Health check services on both blue and green
        run: |
          set -euo pipefail
          ACTIVE_COLOR="${{ needs.detect-deployment-color-test.outputs.active-color }}"
          TARGET_COLOR="${{ needs.detect-deployment-color-test.outputs.target-color }}"
          
          # Wait for all LoadBalancer services to get external IPs for both colors
          echo "Waiting for LoadBalancer EXTERNAL-IPs..."
          services=(ecompoc-${ACTIVE_COLOR} ui-${ACTIVE_COLOR} ecompoc-${TARGET_COLOR} ui-${TARGET_COLOR})
          declare -A service_hosts
          
          for svc in "${services[@]}"; do
            echo "Waiting for LoadBalancer EXTERNAL-IP for ${svc}..."
            host=""
            for i in {1..60}; do
              ip=$(kubectl get svc ${svc} -n test -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
              if [ -z "${ip}" ]; then
                hostname=$(kubectl get svc ${svc} -n test -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
              else
                hostname=""
              fi
              host=${ip:-$hostname}
              if [ -n "${host}" ]; then
                echo "${svc} endpoint: ${host}"
                service_hosts[${svc}]=${host}
                break
              fi
              sleep 5
            done
            if [ -z "${host}" ]; then
              echo "Timed out waiting for EXTERNAL-IP/hostname for ${svc}" >&2
              exit 1
            fi
          done
          
          # Perform health checks using LoadBalancer external IPs for both colors
          echo "Checking API services health via LoadBalancer..."
          api_services=(ecompoc-${ACTIVE_COLOR} ecompoc-${TARGET_COLOR})
          for svc in "${api_services[@]}"; do
            host=${service_hosts[${svc}]}
            echo "Checking health for ${svc} at http://${host}/actuator/health..."
            for i in {1..30}; do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://${host}/actuator/health || echo "000")
              if [ "${code}" = "200" ]; then
                echo "${svc} is healthy (HTTP 200)"
                break
              fi
              sleep 5
              if [ $i -eq 30 ]; then
                echo "${svc} health check failed. Last code: ${code}" >&2
                exit 1
              fi
            done
          done
          
          # Check UI services via LoadBalancer for both colors
          for color in ${ACTIVE_COLOR} ${TARGET_COLOR}; do
            ui_host=${service_hosts[ui-${color}]}
            echo "Checking health for ui-${color} at http://${ui_host}/health..."
            for i in {1..30}; do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://${ui_host}/health || echo "000")
              if [ "${code}" = "200" ]; then
                echo "ui-${color} is healthy (HTTP 200)"
                break
              fi
              sleep 5
              if [ $i -eq 30 ]; then
                echo "ui-${color} health check failed. Last code: ${code}" >&2
                exit 1
              fi
            done
          done

  selenium-tests-test:
    runs-on: ubuntu-latest
    needs: [health-check-test, detect-deployment-color-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover AKS and set context
        run: |
          AKS_NAME=$(az aks list -g "${AKS_RESOURCE_GROUP}" --query "[0].name" -o tsv)
          echo "Using AKS cluster: ${AKS_NAME}"
          az aks get-credentials -g "${AKS_RESOURCE_GROUP}" -n "${AKS_NAME}" --overwrite-existing

      - name: Get UI service URLs for both colors
        id: get-ui-urls
        run: |
          ACTIVE_COLOR="${{ needs.detect-deployment-color-test.outputs.active-color }}"
          TARGET_COLOR="${{ needs.detect-deployment-color-test.outputs.target-color }}"
          
          for color in ${ACTIVE_COLOR} ${TARGET_COLOR}; do
            echo "Getting UI service URL for ui-${color}..."
            ui_host=""
            for i in {1..30}; do
              ip=$(kubectl get svc ui-${color} -n test -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
              if [ -z "${ip}" ]; then
                hostname=$(kubectl get svc ui-${color} -n test -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
              else
                hostname=""
              fi
              ui_host=${ip:-$hostname}
              if [ -n "${ui_host}" ]; then
                echo "url-${color}=http://${ui_host}" >> $GITHUB_OUTPUT
                echo "Got URL for ui-${color}: http://${ui_host}"
                break
              fi
              sleep 2
            done
            if [ -z "${ui_host}" ]; then
              echo "Failed to get UI service URL for ui-${color}" >&2
              exit 1
            fi
          done

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
          cache-dependency-path: selenium/pom.xml

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Run Selenium E2E Tests on Active Color
        working-directory: selenium
        env:
          BASE_URL: ${{ needs.detect-deployment-color-test.outputs.active-color == 'blue' && steps.get-ui-urls.outputs.url-blue || steps.get-ui-urls.outputs.url-green }}
        run: |
          mvn clean test

      - name: Run Selenium E2E Tests on Target Color
        working-directory: selenium
        env:
          BASE_URL: ${{ needs.detect-deployment-color-test.outputs.target-color == 'blue' && steps.get-ui-urls.outputs.url-blue || steps.get-ui-urls.outputs.url-green }}
        run: |
          mvn clean test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports-test
          path: selenium/target/surefire-reports/
          retention-days: 7

