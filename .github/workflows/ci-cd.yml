  teardown-dev:
    name: Teardown Inactive Deployment for Dev
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-dev-ui, detect-deployment-color-dev]
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover AKS and set context
        run: |
          AKS_NAME=$(az aks list -g "${AKS_RESOURCE_GROUP}" --query "[0].name" -o tsv)
          echo "Using AKS cluster: ${AKS_NAME}"
          az aks get-credentials -g "${AKS_RESOURCE_GROUP}" -n "${AKS_NAME}" --overwrite-existing

      - name: Teardown inactive deployments and services
        run: |
          ACTIVE_COLOR="${{ needs.detect-deployment-color-dev.outputs.active-color }}"
          echo "Teardown inactive deployment (${ACTIVE_COLOR})"
          
          # Get the list of services
          services=("ecompoc" "ui")
          
          # Delete deployments and services for the inactive color
          for svc in "${services[@]}"; do
            echo "Deleting ${svc}-${ACTIVE_COLOR}..."
            kubectl delete deployment ${svc}-${ACTIVE_COLOR} -n dev --ignore-not-found=true || true
            kubectl delete service ${svc}-${ACTIVE_COLOR} -n dev --ignore-not-found=true || true
          done

  update-state-dev:
    name: Update Deployment State for Dev
    runs-on: ubuntu-latest
    needs: [teardown-dev, detect-deployment-color-dev]
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover AKS and set context
        run: |
          AKS_NAME=$(az aks list -g "${AKS_RESOURCE_GROUP}" --query "[0].name" -o tsv)
          echo "Using AKS cluster: ${AKS_NAME}"
          az aks get-credentials -g "${AKS_RESOURCE_GROUP}" -n "${AKS_NAME}" --overwrite-existing

      - name: Update ConfigMap with new active color
        run: |
          TARGET_COLOR="${{ needs.detect-deployment-color-dev.outputs.target-color }}"
          echo "Updating deployment state to mark ${TARGET_COLOR} as active"
          kubectl patch configmap deployment-state -n dev --type merge -p "{\"data\":{\"active-color\":\"${TARGET_COLOR}\"}}"

  detect-deployment-color-test:
    name: Detect Deployment Color for Test
    runs-on: ubuntu-latest
    needs: [discover-apps, build-push, build-push-ui]
    outputs:
      active-color: ${{ steps.detect-color.outputs.active-color }}
      target-color: ${{ steps.detect-color.outputs.target-color }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover AKS and set context
        run: |
          AKS_NAME=$(az aks list -g "${AKS_RESOURCE_GROUP}" --query "[0].name" -o tsv)
          echo "Using AKS cluster: ${AKS_NAME}"
          az aks get-credentials -g "${AKS_RESOURCE_GROUP}" -n "${AKS_NAME}" --overwrite-existing

      - name: Ensure ConfigMap exists
        run: |
          kubectl get configmap deployment-state -n test 2>/dev/null || kubectl apply -f k8s/deployment-state-configmap.yaml

      - name: Detect deployment color
        id: detect-color
        run: |
          ACTIVE_COLOR=$(kubectl get configmap deployment-state -n test -o jsonpath='{.data.active-color}' 2>/dev/null || echo "blue")
          if [ "$ACTIVE_COLOR" = "blue" ]; then
            TARGET_COLOR="green"
          else
            TARGET_COLOR="blue"
          fi
          echo "active-color=$ACTIVE_COLOR" >> $GITHUB_OUTPUT
          echo "target-color=$TARGET_COLOR" >> $GITHUB_OUTPUT
          echo "Active color: $ACTIVE_COLOR, Target color: $TARGET_COLOR"

  deploy-test:
    name: Deploy to Test (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [discover-apps, build-push, detect-deployment-color-test]
    environment: test
    strategy:
      matrix: ${{ fromJson(needs.discover-apps.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover AKS and set context
        run: |
          AKS_NAME=$(az aks list -g "${AKS_RESOURCE_GROUP}" --query "[0].name" -o tsv)
          echo "Using AKS cluster: ${AKS_NAME}"
          az aks get-credentials -g "${AKS_RESOURCE_GROUP}" -n "${AKS_NAME}" --overwrite-existing
          kubectl create namespace test --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or update Kubernetes secret for SQL database
        run: |
          kubectl create secret generic sql-db-secret \
            --from-literal=password="${{ secrets.SQL_SERVER_PASSWORD }}" \
            --namespace=test \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy manifest
        run: |
          TARGET_COLOR="${{ needs.detect-deployment-color-test.outputs.target-color }}"
          tmpdir=$(mktemp -d)
          pushd "$tmpdir"
          cp ${GITHUB_WORKSPACE}/k8s/${{ matrix.app }}/deployment.yaml .
          cp ${GITHUB_WORKSPACE}/k8s/${{ matrix.app }}/service.yaml .
          # Add deployment-color to deployment selector and pod labels using yq
          yq eval ".spec.selector.matchLabels.deployment-color = \"${TARGET_COLOR}\"" -i deployment.yaml
          yq eval ".spec.template.metadata.labels.deployment-color = \"${TARGET_COLOR}\"" -i deployment.yaml
          # Add deployment-color to service selector using yq
          yq eval ".spec.selector.deployment-color = \"${TARGET_COLOR}\"" -i service.yaml
          # Apply kustomization with nameSuffix
          cat > kustomization.yaml << EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          nameSuffix: -${TARGET_COLOR}
          namespace: test
          resources:
            - deployment.yaml
            - service.yaml
          EOF
          kubectl apply -k .
          popd

      - name: Update image to current SHA
        run: |
          TARGET_COLOR="${{ needs.detect-deployment-color-test.outputs.target-color }}"
          kubectl set image deployment/${{ matrix.app }}-${TARGET_COLOR} ${{ matrix.app }}=${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app }}:${{ github.sha }} -n test

      - name: Annotate deployment and service
        run: |
          TARGET_COLOR="${{ needs.detect-deployment-color-test.outputs.target-color }}"
          kubectl annotate deployment/${{ matrix.app }}-${TARGET_COLOR} app.kubernetes.io/instance=${{ matrix.app }}-${TARGET_COLOR} -n test --overwrite
          kubectl annotate service/${{ matrix.app }}-${TARGET_COLOR} app.kubernetes.io/instance=${{ matrix.app }}-${TARGET_COLOR} -n test --overwrite

      - name: Wait for rollout
        run: |
          TARGET_COLOR="${{ needs.detect-deployment-color-test.outputs.target-color }}"
          kubectl rollout status deployment/${{ matrix.app }}-${TARGET_COLOR} -n test --timeout=180s || exit 1

