            else
              hostname=""
            fi
            ui_host=${ip:-$hostname}
            if [ -n "${ui_host}" ]; then
              echo "url=http://${ui_host}" >> $GITHUB_OUTPUT
              break
            fi
            sleep 2
          done
          if [ -z "${ui_host}" ]; then
            echo "Failed to get UI service URL" >&2
