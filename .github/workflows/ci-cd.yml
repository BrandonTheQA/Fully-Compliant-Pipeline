          echo "Using AKS cluster: ${AKS_NAME}"
          az aks get-credentials -g "${AKS_RESOURCE_GROUP}" -n "${AKS_NAME}" --overwrite-existing
          kubectl create namespace test --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or update Kubernetes secret for SQL database
        run: |
          kubectl create secret generic sql-db-secret \
            --from-literal=password="${{ secrets.SQL_SERVER_PASSWORD }}" \
            --namespace=test \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy manifest
        run: |
          tmpdir=$(mktemp -d)
          pushd "$tmpdir"
          cp ${GITHUB_WORKSPACE}/k8s/${{ matrix.app }}/deployment.yaml .
          cp ${GITHUB_WORKSPACE}/k8s/${{ matrix.app }}/service.yaml .
          cat > kustomization.yaml << EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          nameSuffix: -blue
          namespace: test
          resources:
            - deployment.yaml
            - service.yaml
          EOF
          kubectl apply -k .
          popd

      - name: Update image to current SHA
        run: |
          kubectl set image deployment/${{ matrix.app }}-blue ${{ matrix.app }}=${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app }}:${{ github.sha }} -n test

      - name: Annotate deployment and service as -blue
        run: |
          kubectl annotate deployment/${{ matrix.app }} app.kubernetes.io/instance=${{ matrix.app }}-blue -n test --overwrite
          kubectl annotate service/${{ matrix.app }} app.kubernetes.io/instance=${{ matrix.app }}-blue -n test --overwrite

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ matrix.app }}-blue -n test --timeout=180s || exit 1

  deploy-test-ui:
    name: Deploy UI to Test
    runs-on: ubuntu-latest
    needs: [build-push-ui, selenium-tests-dev]
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover AKS and set context
        run: |
          AKS_NAME=$(az aks list -g "${AKS_RESOURCE_GROUP}" --query "[0].name" -o tsv)
          echo "Using AKS cluster: ${AKS_NAME}"
          az aks get-credentials -g "${AKS_RESOURCE_GROUP}" -n "${AKS_NAME}" --overwrite-existing
          kubectl create namespace test --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy manifest
        run: |
          tmpdir=$(mktemp -d)
          pushd "$tmpdir"
          cp ${GITHUB_WORKSPACE}/k8s/ui/deployment.yaml .
          cp ${GITHUB_WORKSPACE}/k8s/ui/service.yaml .
          cat > kustomization.yaml << EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          nameSuffix: -blue
          namespace: test
          resources:
            - deployment.yaml
            - service.yaml
          EOF
          kubectl apply -k .
          popd

      - name: Update image to current SHA
        run: |
          kubectl set image deployment/ui-blue ui=${{ env.ACR_LOGIN_SERVER }}/ui:${{ github.sha }} -n test

      - name: Annotate UI deployment and service as -blue
        run: |
          kubectl annotate deployment/ui app.kubernetes.io/instance=ui-blue -n test --overwrite
          kubectl annotate service/ui app.kubernetes.io/instance=ui-blue -n test --overwrite

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/ui-blue -n test --timeout=180s || exit 1

