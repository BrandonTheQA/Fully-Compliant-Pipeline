          echo "Using AKS cluster: ${AKS_NAME}"
          az aks get-credentials -g "${AKS_RESOURCE_GROUP}" -n "${AKS_NAME}" --overwrite-existing

      - name: Get UI service URL
        id: get-ui-url
        run: |
          ui_host=""
          for i in {1..30}; do
            ip=$(kubectl get svc ui-blue -n test -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
