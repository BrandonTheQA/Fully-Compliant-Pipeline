name: CI-CD AKS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ACR_NAME: rgpocacr9021
  ACR_LOGIN_SERVER: rgpocacr9021.azurecr.io
  AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
  JAVA_VERSION: '17'

permissions:
  id-token: write
  contents: read

jobs:
  discover-apps:
    name: Discover Function Apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Discover function apps
        id: set-matrix
        run: |
          apps=$(find api/services -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | jq -R -s -c 'split("\n")[:-1]')
          matrix=$(echo $apps | jq -c '{include: [.[] | {
            app: .,
            "working-dir": ("./api/services/" + .)
          }]}')
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  build-push:
    name: Build and Push Docker Image (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: discover-apps
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix: ${{ fromJson(needs.discover-apps.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: |
          az acr login -n "${ACR_NAME}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.working-dir }}
          file: ${{ matrix.working-dir }}/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app }}:latest
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app }}:buildcache,mode=max

  build-push-ui:
    name: Build and Push UI Docker Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: |
          az acr login -n "${ACR_NAME}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/ui:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/ui:latest
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/ui:buildcache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/ui:buildcache,mode=max

  deploy-dev:
    name: Deploy to Dev (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [discover-apps, build-push]
    environment: dev
    strategy:
      matrix: ${{ fromJson(needs.discover-apps.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover AKS and set context
        run: |
          AKS_NAME=$(az aks list -g "${AKS_RESOURCE_GROUP}" --query "[0].name" -o tsv)
          echo "Using AKS cluster: ${AKS_NAME}"
          az aks get-credentials -g "${AKS_RESOURCE_GROUP}" -n "${AKS_NAME}" --overwrite-existing
          kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or update Kubernetes secret for SQL database
        run: |
          kubectl create secret generic sql-db-secret \
            --from-literal=password="${{ secrets.SQL_SERVER_PASSWORD }}" \
            --namespace=dev \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy manifest
        run: |
          tmpdir=$(mktemp -d)
          pushd "$tmpdir"
          cp ${GITHUB_WORKSPACE}/k8s/${{ matrix.app }}/deployment.yaml .
          cp ${GITHUB_WORKSPACE}/k8s/${{ matrix.app }}/service.yaml .
          cat > kustomization.yaml << EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          nameSuffix: -blue
          namespace: dev
          resources:
            - deployment.yaml
            - service.yaml
          EOF
          kubectl apply -k .
          popd

      - name: Update image to current SHA
        run: |
          kubectl set image deployment/${{ matrix.app }}-blue ${{ matrix.app }}=${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app }}:${{ github.sha }} -n dev

      - name: Annotate deployment and service as -blue
        run: |
          kubectl annotate deployment/${{ matrix.app }} app.kubernetes.io/instance=${{ matrix.app }}-blue -n dev --overwrite
          kubectl annotate service/${{ matrix.app }} app.kubernetes.io/instance=${{ matrix.app }}-blue -n dev --overwrite

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ matrix.app }}-blue -n dev --timeout=180s || exit 1

  deploy-dev-ui:
    name: Deploy UI to Dev
    runs-on: ubuntu-latest
    needs: build-push-ui
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover AKS and set context
        run: |
          AKS_NAME=$(az aks list -g "${AKS_RESOURCE_GROUP}" --query "[0].name" -o tsv)
          echo "Using AKS cluster: ${AKS_NAME}"
          az aks get-credentials -g "${AKS_RESOURCE_GROUP}" -n "${AKS_NAME}" --overwrite-existing
          kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy manifest
        run: |
          tmpdir=$(mktemp -d)
          pushd "$tmpdir"
          cp ${GITHUB_WORKSPACE}/k8s/ui/deployment.yaml .
          cp ${GITHUB_WORKSPACE}/k8s/ui/service.yaml .
          cat > kustomization.yaml << EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          nameSuffix: -blue
          namespace: dev
          resources:
            - deployment.yaml
            - service.yaml
          EOF
          kubectl apply -k .
          popd

      - name: Update image to current SHA
        run: |
          kubectl set image deployment/ui-blue ui=${{ env.ACR_LOGIN_SERVER }}/ui:${{ github.sha }} -n dev

      - name: Annotate UI deployment and service as -blue
        run: |
          kubectl annotate deployment/ui app.kubernetes.io/instance=ui-blue -n dev --overwrite
          kubectl annotate service/ui app.kubernetes.io/instance=ui-blue -n dev --overwrite

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/ui-blue -n dev --timeout=180s || exit 1

  health-check-dev:
    name: Health Check Services in Dev
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-dev-ui]
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover AKS and set context
        run: |
          AKS_NAME=$(az aks list -g "${AKS_RESOURCE_GROUP}" --query "[0].name" -o tsv)
          echo "Using AKS cluster: ${AKS_NAME}"
          az aks get-credentials -g "${AKS_RESOURCE_GROUP}" -n "${AKS_NAME}" --overwrite-existing

      - name: Health check services
        run: |
          set -euo pipefail
          # Wait for all LoadBalancer services to get external IPs
          echo "Waiting for LoadBalancer EXTERNAL-IPs..."
          services=(order-blue product-blue user-blue ui-blue)
          declare -A service_hosts
          
          for svc in "${services[@]}"; do
            echo "Waiting for LoadBalancer EXTERNAL-IP for ${svc}..."
            host=""
            for i in {1..60}; do
              ip=$(kubectl get svc ${svc} -n dev -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
              if [ -z "${ip}" ]; then
                hostname=$(kubectl get svc ${svc} -n dev -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
              else
                hostname=""
              fi
              host=${ip:-$hostname}
              if [ -n "${host}" ]; then
                echo "${svc} endpoint: ${host}"
                service_hosts[${svc}]=${host}
                break
              fi
              sleep 5
            done
            if [ -z "${host}" ]; then
              echo "Timed out waiting for EXTERNAL-IP/hostname for ${svc}" >&2
              exit 1
            fi
          done
          
          # Perform health checks using LoadBalancer external IPs
          echo "Checking API services health via LoadBalancer..."
          api_services=(order-blue product-blue user-blue)
          for svc in "${api_services[@]}"; do
            host=${service_hosts[${svc}]}
            echo "Checking health for ${svc} at http://${host}/actuator/health..."
            for i in {1..30}; do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://${host}/actuator/health || echo "000")
              if [ "${code}" = "200" ]; then
                echo "${svc} is healthy (HTTP 200)"
                break
              fi
              sleep 5
              if [ $i -eq 30 ]; then
                echo "${svc} health check failed. Last code: ${code}" >&2
                exit 1
              fi
            done
          done
          
          # Check UI service via LoadBalancer
          ui_host=${service_hosts[ui-blue]}
          echo "Checking health for ui-blue at http://${ui_host}/health..."
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://${ui_host}/health || echo "000")
            if [ "${code}" = "200" ]; then
              echo "ui-blue is healthy (HTTP 200)"
              break
            fi
            sleep 5
            if [ $i -eq 30 ]; then
              echo "ui-blue health check failed. Last code: ${code}" >&2
              exit 1
            fi
          done

  selenium-tests-dev:
    runs-on: ubuntu-latest
    needs: health-check-dev
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
          cache-dependency-path: selenium/pom.xml

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Run Selenium E2E Tests
        working-directory: selenium
        env:
          BASE_URL: http://4.249.74.188
        run: |
          mvn clean test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: selenium/target/surefire-reports/
          retention-days: 7

  deploy-test:
    name: Deploy to Test (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [discover-apps, build-push, selenium-tests-dev]
