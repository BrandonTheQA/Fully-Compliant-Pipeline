apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      containers:
        - name: user
          image: rgpocacr9021.azurecr.io/user:latest
          ports:
            - containerPort: 8080
          env:
            - name: SQL_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sql-db-secret
                  key: password
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"


