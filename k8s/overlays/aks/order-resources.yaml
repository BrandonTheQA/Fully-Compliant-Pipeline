apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: dev
spec:
  template:
    spec:
      containers:
        - name: order
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "aks"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

