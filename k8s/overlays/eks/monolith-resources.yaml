apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolith
  namespace: dev
spec:
  template:
    spec:
      containers:
        - name: monolith
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "eks"
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "600m"
              memory: "1Gi"

