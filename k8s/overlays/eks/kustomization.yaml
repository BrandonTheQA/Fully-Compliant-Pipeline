apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patchesStrategicMerge:
  - ecompoc-resources.yaml

# Transform ACR images to ECR images
# Replace <AWS_ACCOUNT_ID> and <REGION> with your actual AWS account ID and region
images:
  - name: rgpocacr9021.azurecr.io/ecompoc
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/ecompoc
  - name: rgpocacr9021.azurecr.io/ui
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/ui

