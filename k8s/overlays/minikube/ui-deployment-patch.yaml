apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: dev
spec:
  template:
    spec:
      # Remove cloud-specific tolerations
      tolerations: []
      containers:
        - name: ui
          imagePullPolicy: Never
          command: ["nginx", "-g", "daemon off;"]
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          env:
            - name: DEPLOYMENT_COLOR
              value: ""
            - name: NAMESPACE
              value: "dev"
      volumes:
        - name: nginx-config
          configMap:
            name: ui-nginx-config

