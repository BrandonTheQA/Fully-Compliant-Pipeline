apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: dev
spec:
  template:
    spec:
      # Remove cloud-specific tolerations
      tolerations: []
      containers:
        - name: ui
          imagePullPolicy: Never
          env:
            - name: DEPLOYMENT_COLOR
              value: ""
            - name: NAMESPACE
              value: "dev"
            - name: VITE_API_BASE_URL
              value: ""  # Will be set to ecompoc service LoadBalancer URL after deployment
            - name: PORT
              value: "8080"

