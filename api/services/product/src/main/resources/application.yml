spring:
  application:
    name: product-function
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  
  datasource:
    url: jdbc:sqlserver://poc7029.database.windows.net:1433;database=SQL-POC;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30
    username: bgarlock@poc7029
    password: ${SQL_SERVER_PASSWORD}
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
  
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true

logging:
  level:
    com.example: DEBUG
    org.springframework: INFO
    root: INFO

app:
  name: Product
  version: v1.0.0
  build-date: 2024-01-15

server:
  port: 8080

# Security configuration (disabled for now)
security:
  basic:
    enabled: false

# SpringDoc OpenAPI (Swagger) Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.example.controller
  paths-to-match: /api/**

