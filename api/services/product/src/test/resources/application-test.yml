spring:
  profiles:
    active: test
  
  application:
    name: product-function-test
  
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  
  liquibase:
    enabled: false

logging:
  level:
    com.example: DEBUG
    org.springframework: WARN
    root: INFO

# Test-specific configuration
test:
  data:
    cleanup: true

