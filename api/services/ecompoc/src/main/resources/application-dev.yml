spring:
  application:
    name: ecompoc-service-dev
  datasource:
    url: jdbc:sqlserver://136.116.134.139:1433;database=pocdb;encrypt=true;trustServerCertificate=true;loginTimeout=30
    username: bgarlock
    password: ${SQL_SERVER_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true

logging:
  level:
    com.example.ecompoc: DEBUG
    org.springframework: INFO
    root: INFO

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.example.ecompoc
  paths-to-match: /api/**

abandoned-cart:
  enabled: false

stock-management:
  enabled: true
  low-stock-threshold-default: 10
  notification-delay-minutes: 60
  admin-email: admin@example.com

