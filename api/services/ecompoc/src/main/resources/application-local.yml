spring:
  datasource:
    url: jdbc:h2:mem:ecompocdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: false
    change-log: ""

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.ecompoc: DEBUG
    org.springframework: INFO
    root: INFO

server:
  port: 8080

abandoned-cart:
  enabled: false

