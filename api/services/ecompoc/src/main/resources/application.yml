spring:
  application:
    name: ecompoc-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:sqlserver://136.116.134.139:1433;database=pocdb;encrypt=true;trustServerCertificate=true;loginTimeout=30
    username: bgarlock
    password: ${SQL_SERVER_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true

logging:
  level:
    com.example.ecompoc: DEBUG
    org.springframework: INFO
    root: INFO

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.example.ecompoc
  paths-to-match: /api/**

shipping:
  rules:
    US:
      free-shipping-threshold: 50.00
      default-shipping-cost: 5.99
    CA:
      free-shipping-threshold: 75.00
      default-shipping-cost: 9.99
    default:
      free-shipping-threshold: 50.00
      default-shipping-cost: 5.99

