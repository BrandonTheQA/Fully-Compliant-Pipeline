spring:
  datasource:
    url: jdbc:h2:mem:ecompoctestdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  liquibase:
    enabled: false

abandoned-cart:
  enabled: false

