spring:
  application:
    name: order-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true

logging:
  level:
    com.example: DEBUG
    org.springframework: INFO
    root: INFO

app:
  name: Order
  version: v1.0.0

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.example.controller
  paths-to-match: /api/**

services:
  user:
    base-url: ${USER_SERVICE_URL:http://user-service/api}
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://product-service/api}


