spring:
  application:
    name: order-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true

logging:
  level:
    com.example: DEBUG
    org.springframework: INFO
    root: INFO

app:
  name: Order
  version: v1.0.0
  build-date: 2024-01-15

server:
  port: ${SERVER_PORT:8082}

# Security configuration (disabled for now)
security:
  basic:
    enabled: false

# SpringDoc OpenAPI (Swagger) Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.example.controller
  paths-to-match: /api/**

# External service endpoints - environment based
services:
  user:
    base-url: ${USER_SERVICE_URL:http://${USER_SERVICE_HOST:user-service}:${USER_SERVICE_PORT:8080}/api}
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://${PRODUCT_SERVICE_HOST:product-service}:${PRODUCT_SERVICE_PORT:8081}/api}

