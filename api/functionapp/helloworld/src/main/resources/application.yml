spring:
  application:
    name: helloworld-function
  profiles:
    active: local

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true

logging:
  level:
    com.example: DEBUG
    org.springframework: INFO
    root: INFO

app:
  name: HelloWorld
  version: v2.1.0
  build-date: 2024-01-15

server:
  port: 8080
