spring:
  application:
    name: product-function
  profiles:
    active: local

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true

logging:
  level:
    com.example: DEBUG
    org.springframework: INFO
    root: INFO

app:
  name: Product
  version: v1.0.0
  build-date: 2024-01-15

server:
  port: 8080

# Security configuration (disabled for now)
security:
  basic:
    enabled: false

